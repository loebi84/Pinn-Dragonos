
name: 🐉 Build DragonOS Pi64 for PINN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  DRAGONOS_URL: "https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz/download"
  IMAGE_GZ: "DragonOS_Pi64_Beta42.img.gz"
  IMAGE: "DragonOS_Pi64_Beta42.img"

jobs:
  build-pinn:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository klonen
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 6. Partitionen robust erkennen und Tarballs erzeugen
      # ----------------------------------------------------------

      - name: 🔧 PINN Tarballs erzeugen
        shell: bash
        run: |
          set -euo pipefail

          WORK="$PWD/work"
          BOOT="$WORK/boot"
          ROOT="$WORK/root"

          mkdir -p "$BOOT" "$ROOT"

          SECTOR_SIZE=$(sudo blockdev --getss "$IMAGE")

          echo "Sektorgröße: ${SECTOR_SIZE} Bytes"

          # ------------------------------------------------------
          # Partitionstabelle mit parted -- machine readable
          # ------------------------------------------------------

          echo
          echo "===== Partitionen ====="

          sudo parted -s "$IMAGE" unit s print

          # Ausgabeformat:
          # Nummer:Start:Ende:Größe:Dateisystem:Name:Flags

          PART1=$(sudo parted -ms "$IMAGE" unit s print \
            | awk -F: '$1 ~ /^[0-9]+$/ && $1 == 1 {print}')

          PART2=$(sudo parted -ms "$IMAGE" unit s print \
            | awk -F: '$1 ~ /^[0-9]+$/ && $1 == 2 {print}')

          if [[ -z "$PART1" ]]; then
            echo "❌ Partition 1 wurde nicht gefunden."
            exit 1
          fi

          if [[ -z "$PART2" ]]; then
            echo "❌ Partition 2 wurde nicht gefunden."
            exit 1
          fi

          echo
          echo "Partition 1:"
          echo "$PART1"

          echo
          echo "Partition 2:"
          echo "$PART2"

          # ------------------------------------------------------
          # Felder auslesen
          # ------------------------------------------------------

          PART1_FS=$(echo "$PART1" | cut -d: -f5)
          PART2_FS=$(echo "$PART2" | cut -d: -f5)

          PART1_START=$(echo "$PART1" | cut -d: -f2 | sed 's/s$//')
          PART1_END=$(echo "$PART1" | cut -d: -f3 | sed 's/s$//')

          PART2_START=$(echo "$PART2" | cut -d: -f2 | sed 's/s$//')
          PART2_END=$(echo "$PART2" | cut -d: -f3 | sed 's/s$//')

          # ------------------------------------------------------
          # Dateisysteme überprüfen
          # ------------------------------------------------------

          PART1_FS_LOWER=$(echo "$PART1_FS" | tr '[:upper:]' '[:lower:]')
          PART2_FS_LOWER=$(echo "$PART2_FS" | tr '[:upper:]' '[:lower:]')

          if [[ "$PART1_FS_LOWER" != "fat32" && \
                "$PART1_FS_LOWER" != "fat16" && \
                "$PART1_FS_LOWER" != "fat" ]]; then

            echo "❌ Partition 1 ist nicht FAT."
            echo "   Gefunden: '$PART1_FS'"
            exit 1
          fi

          if [[ "$PART2_FS_LOWER" != "ext4" && \
                "$PART2_FS_LOWER" != "ext3" && \
                "$PART2_FS_LOWER" != "ext2" ]]; then

            echo "❌ Partition 2 ist kein Linux-Dateisystem."
            echo "   Gefunden: '$PART2_FS'"
            exit 1
          fi

          # ------------------------------------------------------
          # Root-Partition explizit verifizieren
          # ------------------------------------------------------

          ROOT_SECTORS=$((PART2_END - PART2_START + 1))
          ROOT_SIZE_BYTES=$((ROOT_SECTORS * SECTOR_SIZE))

          if (( ROOT_SIZE_BYTES < 1024 * 1024 * 1024 )); then
            echo "❌ Root-Partition ist kleiner als 1 GiB."
            echo "   Größe: $((ROOT_SIZE_BYTES / 1024 / 1024)) MiB"
            exit 1
          fi

          echo
          echo "✅ Partitionen erkannt:"
          echo
          echo "BOOT"
          echo "  Nummer : 1"
          echo "  FS     : $PART1_FS"
          echo "  Start  : $PART1_START"
          echo "  Ende   : $PART1_END"
          echo
          echo "ROOT"
          echo "  Nummer : 2"
          echo "  FS     : $PART2_FS"
          echo "  Start  : $PART2_START"
          echo "  Ende   : $PART2_END"
          echo "  Größe  : $((ROOT_SIZE_BYTES / 1024 / 1024)) MiB"

          # ------------------------------------------------------
          # Offsets berechnen
          # ------------------------------------------------------

          BOOT_OFFSET=$((PART1_START * SECTOR_SIZE))
          ROOT_OFFSET=$((PART2_START * SECTOR_SIZE))

          echo
          echo "BOOT Offset: $BOOT_OFFSET"
          echo "ROOT Offset: $ROOT_OFFSET"

          # ------------------------------------------------------
          # Partitionen readonly mounten
          # ------------------------------------------------------

          cleanup() {
            sudo umount "$BOOT" 2>/dev/null || true
            sudo umount "$ROOT" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo
          echo "==> Mount boot"

          sudo mount \
            -o loop,ro,offset="$BOOT_OFFSET" \
            "$IMAGE" \
            "$BOOT"

          echo "==> Mount root"

          sudo mount \
            -o loop,ro,offset="$ROOT_OFFSET" \
            "$IMAGE" \
            "$ROOT"

          # ------------------------------------------------------
          # Zusätzliche Sicherheitsprüfung
          # ------------------------------------------------------

          echo
          echo "===== BOOT Inhalt ====="
          sudo ls -la "$BOOT" | head -30

          echo
          echo "===== ROOT Inhalt ====="
          sudo ls -la "$ROOT" | head -30

          # Raspberry-Pi-Bootpartition sollte firmware enthalten
          if [[ ! -e "$BOOT/config.txt" && \
                ! -e "$BOOT/config.txt.bak" && \
                ! -e "$BOOT/config.txt.default" ]]; then

            echo "⚠️ Keine config.txt im Boot-Dateisystem gefunden."
            echo "   Das kann bei neueren Raspberry-Pi-Images normal sein."
          fi

          # Root sollte typische Linux-Verzeichnisse besitzen
          for DIR in bin etc usr var; do
            if [[ ! -d "$ROOT/$DIR" ]]; then
              echo "❌ Root-Partition sieht nicht wie ein Linux-Root aus:"
              echo "   $ROOT/$DIR fehlt."
              exit 1
            fi
          done

          echo
          echo "✅ Root-Partition erfolgreich verifiziert."

          # ------------------------------------------------------
          # Boot Tarball
          # ------------------------------------------------------

          echo
          echo "==> Erzeuge boot.tar.xz"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            -C "$BOOT" \
            -cJf boot.tar.xz .

          # ------------------------------------------------------
          # Root Tarball
          # ------------------------------------------------------

          echo "==> Erzeuge root.tar.xz"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            --exclude="./lost+found" \
            -C "$ROOT" \
            -cJf root.tar.xz .

          # ------------------------------------------------------
          # Größen
          # ------------------------------------------------------

          BOOT_UNCOMPRESSED=$(sudo du -sm "$BOOT" | awk '{print $1}')
          ROOT_UNCOMPRESSED=$(sudo du -sm "$ROOT" | awk '{print $1}')

          BOOT_PARTITION_SIZE=$(
            (PART1_END - PART1_START + 1) \
            * SECTOR_SIZE / 1024 / 1024
          ))

          ROOT_PARTITION_SIZE=$(
            (PART2_END - PART2_START + 1) \
            * SECTOR_SIZE / 1024 / 1024
          ))

          BOOT_NOMINAL=$((BOOT_UNCOMPRESSED + 100))
          ROOT_NOMINAL=$((ROOT_UNCOMPRESSED + 400))

          BOOT_SHA512=$(sha512sum boot.tar.xz | awk '{print $1}')
          ROOT_SHA512=$(sha512sum root.tar.xz | awk '{print $1}')

          BOOT_SIZE=$(stat -c%s boot.tar.xz)
          ROOT_SIZE=$(stat -c%s root.tar.xz)

          DOWNLOAD_SIZE=$((BOOT_SIZE + ROOT_SIZE))
          NOMINAL_SIZE=$((BOOT_NOMINAL + ROOT_NOMINAL))

          echo
          echo "===== Ergebnis ====="
          echo "Boot Partition : ${BOOT_PARTITION_SIZE} MiB"
          echo "Boot Daten     : ${BOOT_UNCOMPRESSED} MiB"
          echo "Root Partition : ${ROOT_PARTITION_SIZE} MiB"
          echo "Root Daten     : ${ROOT_UNCOMPRESSED} MiB"
          echo "Boot Tarball   : ${BOOT_SIZE} Bytes"
          echo "Root Tarball   : ${ROOT_SIZE} Bytes"

          # ------------------------------------------------------
          # Werte exportieren
          # ------------------------------------------------------

          {
            echo "BOOT_START=$PART1_START"
            echo "BOOT_END=$PART1_END"
            echo "ROOT_START=$PART2_START"
            echo "ROOT_END=$PART2_END"

            echo "BOOT_FS=$PART1_FS"
            echo "ROOT_FS=$PART2_FS"

            echo "BOOT_OFFSET=$BOOT_OFFSET"
            echo "ROOT_OFFSET=$ROOT_OFFSET"

            echo "BOOT_NOMINAL=$BOOT_NOMINAL"
            echo "ROOT_NOMINAL=$ROOT_NOMINAL"

            echo "BOOT_UNCOMPRESSED=$BOOT_UNCOMPRESSED"
            echo "ROOT_UNCOMPRESSED=$ROOT_UNCOMPRESSED"

            echo "BOOT_PARTITION_SIZE=$BOOT_PARTITION_SIZE"
            echo "ROOT_PARTITION_SIZE=$ROOT_PARTITION_SIZE"

            echo "BOOT_SHA512=$BOOT_SHA512"
            echo "ROOT_SHA512=$ROOT_SHA512"

            echo "BOOT_SIZE=$BOOT_SIZE"
            echo "ROOT_SIZE=$ROOT_SIZE"

            echo "DOWNLOAD_SIZE=$DOWNLOAD_SIZE"
            echo "NOMINAL_SIZE=$NOMINAL_SIZE"
          } >> "$GITHUB_ENV"

          echo
          echo "✅ DragonOS Partitionen erfolgreich erkannt und konvertiert."