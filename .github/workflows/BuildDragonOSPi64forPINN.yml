name: 🐉 Build DragonOS Pi64 for PINN

on:
  workflow_dispatch:
    inputs:
      force_download:
        description: "DragonOS IMG neu herunterladen und PINN neu bauen"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  DRAGONOS_URL: "https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz/download"

  IMAGE_GZ: "DragonOS_Pi64_Beta42.img.gz"
  IMAGE: "DragonOS_Pi64_Beta42.img"

  SF_HOST: "frs.sourceforge.net"
  SF_PROJECT: "dragonos-pi64"
  SF_RELEASE: "PINN"

  SF_CACHE: "PINN/cache"

  OS_NAME: "DragonOS_Pi64"
  OS_VERSION: "Beta42"

  RAW_BASE: "https://raw.githubusercontent.com/loebi84/Pinn-Dragonos/main/dragonos"

jobs:

  build-pinn:

    runs-on: ubuntu-latest

    env:
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}

    steps:

      # ==========================================================
      # 1. Repository
      # ==========================================================

      - name: 📥 Repository klonen
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ==========================================================
      # 2. Tools
      # ==========================================================

      - name: 🔧 Benötigte Tools installieren
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            gzip \
            xz-utils \
            parted \
            util-linux \
            e2fsprogs \
            dosfstools \
            rsync \
            jq \
            curl \
            openssh-client

      # ==========================================================
      # 3. SourceForge SSH vorbereiten
      # ==========================================================

      - name: 🔐 SourceForge SSH vorbereiten
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${SF_USERNAME:-}" ]]; then
            echo "❌ SF_USERNAME fehlt."
            exit 1
          fi

          if [[ -z "${SF_SSH_KEY:-}" ]]; then
            echo "❌ SF_SSH_KEY fehlt."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SF_SSH_KEY" \
            > ~/.ssh/sourceforge_key

          chmod 600 ~/.ssh/sourceforge_key

          ssh-keyscan -H "$SF_HOST" \
            >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host $SF_HOST
            HostName $SF_HOST
            User $SF_USERNAME
            IdentityFile ~/.ssh/sourceforge_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

          echo "✅ SourceForge SSH vorbereitet."

      # ==========================================================
      # 4. Prüfen ob bereits fertige PINN-Tarballs existieren
      # ==========================================================

      - name: 🔎 Vorhandenen PINN-Build prüfen
        id: cache_check
        shell: bash
        run: |
          set -Eeuo pipefail

          FORCE="${{ inputs.force_download || 'false' }}"

          echo "Force download: $FORCE"

          if [[ "$FORCE" == "true" ]]; then
            echo "force_download=true"
            echo "Ein kompletter Neubau wird durchgeführt."

            echo "REUSE_BUILD=false" >> "$GITHUB_ENV"

            exit 0
          fi

          DEST="${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_RELEASE}/"

          mkdir -p build-cache

          echo
          echo "==> Prüfe vorhandene PINN-Tarballs auf SourceForge"

          if rsync \
            -e "ssh -F ~/.ssh/config" \
            --list-only \
            "$DEST" \
            2>/dev/null |
            grep -q "boot.tar.xz"
          then

            if rsync \
              -e "ssh -F ~/.ssh/config" \
              --list-only \
              "$DEST" \
              2>/dev/null |
              grep -q "root.tar.xz"
            then

              echo
              echo "✅ Vorhandener PINN-Build gefunden."

              echo "REUSE_BUILD=true" >> "$GITHUB_ENV"

              exit 0
            fi
          fi

          echo
          echo "ℹ️ Kein vollständiger PINN-Build vorhanden."

          echo "REUSE_BUILD=false" >> "$GITHUB_ENV"

      # ==========================================================
      # 5. Vorhandene Tarballs wiederverwenden
      # ==========================================================

      - name: ♻️ Vorhandene PINN-Tarballs herunterladen
        if: env.REUSE_BUILD == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          DEST="${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_RELEASE}/"

          echo "==> Lade vorhandenen PINN-Build"

          rsync \
            -avP \
            -e "ssh -F ~/.ssh/config" \
            "$DEST/boot.tar.xz" \
            "$DEST/root.tar.xz" \
            .

          echo
          echo "==> Vorhandene Tarballs:"

          ls -lh \
            boot.tar.xz \
            root.tar.xz

      # ==========================================================
      # 6. DragonOS nur bei notwendigem Neubau herunterladen
      # ==========================================================

      - name: 📥 DragonOS Pi64 Beta42 herunterladen
        if: env.REUSE_BUILD != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "🐉 DragonOS Pi64 Beta42"
          echo "=========================================="

          echo
          echo "==> Download"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 7200 \
            --progress-bar \
            --output "$IMAGE_GZ.tmp" \
            "$DRAGONOS_URL"

          echo
          echo "==> GZIP prüfen"

          gzip -t "$IMAGE_GZ.tmp"

          mv "$IMAGE_GZ.tmp" "$IMAGE_GZ"

          echo
          echo "==> SHA256"

          IMAGE_SHA256=$(
            sha256sum "$IMAGE_GZ" |
            awk '{print $1}'
          )

          echo "$IMAGE_SHA256" \
            > "${IMAGE_GZ}.sha256"

          echo
          echo "DragonOS SHA256:"
          echo "$IMAGE_SHA256"

          echo
          echo "Download:"
          ls -lh "$IMAGE_GZ"

          {
            echo "IMAGE_SHA256=$IMAGE_SHA256"
          } >> "$GITHUB_ENV"

      # ==========================================================
      # 7. Image entpacken
      # ==========================================================

      - name: 📦 DragonOS Image als Sparse-Image entpacken
        if: env.REUSE_BUILD != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "==> Entpacke $IMAGE_GZ"

          gzip -dc "$IMAGE_GZ" |
            cp --sparse=always /dev/stdin "$IMAGE.tmp"

          test -s "$IMAGE.tmp"

          mv "$IMAGE.tmp" "$IMAGE"

          echo
          echo "==> Image"

          file "$IMAGE"

          echo
          echo "Logische Größe:"
          ls -lh "$IMAGE"

          echo
          echo "Physischer Speicher:"
          du -h "$IMAGE"

          echo
          echo "Speicherplatz:"
          df -h "$GITHUB_WORKSPACE"

      # ==========================================================
      # 8. Partitionen erkennen und Tarballs erzeugen
      # ==========================================================

      - name: 🔍 Partitionen erkennen und PINN-Tarballs erzeugen
        if: env.REUSE_BUILD != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          WORK="$PWD/work"
          BOOT="$WORK/boot"
          ROOT="$WORK/root"

          mkdir -p "$BOOT" "$ROOT"

          MOUNTED_BOOT=0
          MOUNTED_ROOT=0

          LOOPDEV=""
          BOOT_LOOPDEV=""
          ROOT_LOOPDEV=""

          cleanup() {

            local status=$?

            set +e

            if (( MOUNTED_ROOT )); then
              sudo umount "$ROOT" 2>/dev/null || \
                sudo umount -l "$ROOT" 2>/dev/null || true
            fi

            if (( MOUNTED_BOOT )); then
              sudo umount "$BOOT" 2>/dev/null || \
                sudo umount -l "$BOOT" 2>/dev/null || true
            fi

            if [[ -n "$ROOT_LOOPDEV" ]]; then
              sudo losetup -d "$ROOT_LOOPDEV" 2>/dev/null || true
            fi

            if [[ -n "$BOOT_LOOPDEV" ]]; then
              sudo losetup -d "$BOOT_LOOPDEV" 2>/dev/null || true
            fi

            if [[ -n "$LOOPDEV" ]]; then
              sudo losetup -d "$LOOPDEV" 2>/dev/null || true
            fi

            exit "$status"
          }

          trap cleanup EXIT

          # ------------------------------------------------------
          # Image prüfen
          # ------------------------------------------------------

          test -s "$IMAGE"

          # ------------------------------------------------------
          # Haupt-Loopdevice
          # ------------------------------------------------------

          LOOPDEV=$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              "$IMAGE"
          )

          echo "Loopdevice: $LOOPDEV"

          SECTOR_SIZE=$(
            sudo blockdev --getss "$LOOPDEV"
          )

          echo "Sektorgröße: $SECTOR_SIZE Bytes"

          # ------------------------------------------------------
          # Partitionstabelle
          # ------------------------------------------------------

          echo
          echo "=============================="
          echo "Partitionstabelle"
          echo "=============================="

          sudo parted \
            -s \
            "$IMAGE" \
            unit s \
            print

          PARTED_OUTPUT=$(
            sudo parted \
              -ms \
              "$IMAGE" \
              unit s \
              print
          )

          PARTITION_LINES=$(
            printf '%s\n' "$PARTED_OUTPUT" |
            awk -F: '$1 ~ /^[0-9]+$/'
          )

          if [[ -z "$PARTITION_LINES" ]]; then
            echo "❌ Keine Partitionen gefunden."
            exit 1
          fi

          echo
          echo "Machine-readable Partitionen:"
          echo "$PARTITION_LINES"

          # ------------------------------------------------------
          # Funktionen
          # ------------------------------------------------------

          get_partition_field() {

            local number="$1"
            local field="$2"

            printf '%s\n' "$PARTITION_LINES" |
            awk -F: \
              -v n="$number" \
              -v f="$field" '
                $1 == n {
                  value = $f
                  sub(/s$/, "", value)
                  print value
                  exit
                }
              '
          }

          get_partition_fs() {

            local number="$1"

            printf '%s\n' "$PARTITION_LINES" |
            awk -F: \
              -v n="$number" '
                $1 == n {
                  print tolower($5)
                  exit
                }
              '
          }

          # ------------------------------------------------------
          # Partitionen erkennen
          # ------------------------------------------------------

          BOOT_PARTITION=""
          ROOT_PARTITION=""

          while IFS= read -r line; do

            [[ -z "$line" ]] && continue

            NUMBER=$(
              printf '%s\n' "$line" |
              cut -d: -f1
            )

            FILESYSTEM=$(
              printf '%s\n' "$line" |
              cut -d: -f5 |
              tr '[:upper:]' '[:lower:]'
            )

            case "$FILESYSTEM" in

              fat|fat16|fat32|vfat)

                [[ -z "$BOOT_PARTITION" ]] &&
                  BOOT_PARTITION="$NUMBER"

                ;;

              ext2|ext3|ext4)

                [[ -z "$ROOT_PARTITION" ]] &&
                  ROOT_PARTITION="$NUMBER"

                ;;

            esac

          done <<< "$PARTITION_LINES"

          if [[ "$BOOT_PARTITION" != "1" ]]; then
            echo "❌ Bootpartition ist nicht p1."
            exit 1
          fi

          if [[ "$ROOT_PARTITION" != "2" ]]; then
            echo "❌ Rootpartition ist nicht p2."
            exit 1
          fi

          BOOT_FS=$(
            get_partition_fs "$BOOT_PARTITION"
          )

          ROOT_FS=$(
            get_partition_fs "$ROOT_PARTITION"
          )

          BOOT_START=$(
            get_partition_field "$BOOT_PARTITION" 2
          )

          BOOT_END=$(
            get_partition_field "$BOOT_PARTITION" 3
          )

          ROOT_START=$(
            get_partition_field "$ROOT_PARTITION" 2
          )

          ROOT_END=$(
            get_partition_field "$ROOT_PARTITION" 3
          )

          # ------------------------------------------------------
          # Werte prüfen
          # ------------------------------------------------------

          for VALUE_NAME in \
            BOOT_START \
            BOOT_END \
            ROOT_START \
            ROOT_END
          do

            VALUE="${!VALUE_NAME}"

            if [[ ! "$VALUE" =~ ^[0-9]+$ ]]; then

              echo "❌ Ungültiger Wert:"
              echo "$VALUE_NAME=$VALUE"

              exit 1

            fi

          done

          # ------------------------------------------------------
          # Größen
          # ------------------------------------------------------

          BOOT_SECTORS=$(
            (BOOT_END - BOOT_START + 1)
          )

          ROOT_SECTORS=$(
            (ROOT_END - ROOT_START + 1)
          )

          BOOT_PARTITION_BYTES=$(
            (BOOT_SECTORS * SECTOR_SIZE)
          )

          ROOT_PARTITION_BYTES=$(
            (ROOT_SECTORS * SECTOR_SIZE)
          )

          BOOT_PARTITION_MIB=$(
            (BOOT_PARTITION_BYTES / 1024 / 1024)
          )

          ROOT_PARTITION_MIB=$(
            (ROOT_PARTITION_BYTES / 1024 / 1024)
          )

          BOOT_OFFSET=$(
            (BOOT_START * SECTOR_SIZE)
          )

          ROOT_OFFSET=$(
            (ROOT_START * SECTOR_SIZE)
          )

          echo
          echo "=============================="
          echo "Erkannte Partitionen"
          echo "=============================="

          echo
          echo "BOOT"
          echo "  Nummer : $BOOT_PARTITION"
          echo "  FS     : $BOOT_FS"
          echo "  Start  : $BOOT_START"
          echo "  Ende   : $BOOT_END"
          echo "  Sektoren: $BOOT_SECTORS"
          echo "  Größe  : $BOOT_PARTITION_MIB MiB"
          echo "  Offset : $BOOT_OFFSET"

          echo
          echo "ROOT"
          echo "  Nummer : $ROOT_PARTITION"
          echo "  FS     : $ROOT_FS"
          echo "  Start  : $ROOT_START"
          echo "  Ende   : $ROOT_END"
          echo "  Sektoren: $ROOT_SECTORS"
          echo "  Größe  : $ROOT_PARTITION_MIB MiB"
          echo "  Offset : $ROOT_OFFSET"

          # ------------------------------------------------------
          # Boot eigenes Loopdevice
          # ------------------------------------------------------

          echo
          echo "==> Boot Loopdevice"

          BOOT_LOOPDEV=$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              --offset "$BOOT_OFFSET" \
              --sizelimit "$BOOT_PARTITION_BYTES" \
              "$IMAGE"
          )

          echo "Boot Loopdevice: $BOOT_LOOPDEV"

          sudo mount \
            -o ro \
            "$BOOT_LOOPDEV" \
            "$BOOT"

          MOUNTED_BOOT=1

          # ------------------------------------------------------
          # Root eigenes Loopdevice
          # ------------------------------------------------------

          echo
          echo "==> Root Loopdevice"

          ROOT_LOOPDEV=$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              --offset "$ROOT_OFFSET" \
              --sizelimit "$ROOT_PARTITION_BYTES" \
              "$IMAGE"
          )

          echo "Root Loopdevice: $ROOT_LOOPDEV"

          sudo mount \
            -o ro \
            "$ROOT_LOOPDEV" \
            "$ROOT"

          MOUNTED_ROOT=1

          # ------------------------------------------------------
          # Root prüfen
          # ------------------------------------------------------

          echo
          echo "==> Prüfe Root-Dateisystem"

          for DIR in etc usr var; do

            if [[ ! -d "$ROOT/$DIR" ]]; then

              echo "❌ $ROOT/$DIR fehlt."

              exit 1

            fi

          done

          echo "✅ Root-Dateisystem OK."

          # ------------------------------------------------------
          # Boot Tarball
          # ------------------------------------------------------

          echo
          echo "==> Erzeuge boot.tar.xz"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            -C "$BOOT" \
            -cJf boot.tar.xz .

          # ------------------------------------------------------
          # Root Tarball
          # ------------------------------------------------------

          echo
          echo "==> Erzeuge root.tar.xz"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            --exclude="./lost+found" \
            -C "$ROOT" \
            -cJf root.tar.xz .

          # ------------------------------------------------------
          # Tarballs testen
          # ------------------------------------------------------

          xz -t boot.tar.xz
          tar -tJf boot.tar.xz >/dev/null

          xz -t root.tar.xz
          tar -tJf root.tar.xz >/dev/null

          echo "✅ Tarballs erfolgreich geprüft."

          # ------------------------------------------------------
          # Unkomprimierte Größen
          # ------------------------------------------------------

          BOOT_RAW_BYTES=$(
            sudo tar \
              --xattrs \
              --acls \
              --numeric-owner \
              --one-file-system \
              -C "$BOOT" \
              -cf - . |
            wc -c
          )

          ROOT_RAW_BYTES=$(
            sudo tar \
              --xattrs \
              --acls \
              --numeric-owner \
              --one-file-system \
              --exclude="./lost+found" \
              -C "$ROOT" \
              -cf - . |
            wc -c
          )

          BOOT_UNCOMPRESSED_MIB=$(
            ( (BOOT_RAW_BYTES + 1024 * 1024 - 1) / 1024 / 1024 )
          )

          ROOT_UNCOMPRESSED_MIB=$(
            ( (ROOT_RAW_BYTES + 1024 * 1024 - 1) / 1024 / 1024 )
          )

          # ------------------------------------------------------
          # PINN Größen
          # ------------------------------------------------------

          BOOT_NOMINAL=$(
            (BOOT_UNCOMPRESSED_MIB + 100)
          )

          ROOT_NOMINAL=$(
            (ROOT_UNCOMPRESSED_MIB + 500)
          )

          NOMINAL_SIZE=$(
            (BOOT_NOMINAL + ROOT_NOMINAL)
          )

          BOOT_SIZE=$(
            stat -c%s boot.tar.xz
          )

          ROOT_SIZE=$(
            stat -c%s root.tar.xz
          )

          DOWNLOAD_SIZE=$(
            (BOOT_SIZE + ROOT_SIZE)
          )

          BOOT_SHA512=$(
            sha512sum boot.tar.xz |
            awk '{print $1}'
          )

          ROOT_SHA512=$(
            sha512sum root.tar.xz |
            awk '{print $1}'
          )

          # ------------------------------------------------------
          # Werte exportieren
          # ------------------------------------------------------

          {
            echo "BOOT_PARTITION_MIB=$BOOT_PARTITION_MIB"
            echo "ROOT_PARTITION_MIB=$ROOT_PARTITION_MIB"

            echo "BOOT_UNCOMPRESSED_MIB=$BOOT_UNCOMPRESSED_MIB"
            echo "ROOT_UNCOMPRESSED_MIB=$ROOT_UNCOMPRESSED_MIB"

            echo "BOOT_NOMINAL=$BOOT_NOMINAL"
            echo "ROOT_NOMINAL=$ROOT_NOMINAL"

            echo "NOMINAL_SIZE=$NOMINAL_SIZE"

            echo "BOOT_SIZE=$BOOT_SIZE"
            echo "ROOT_SIZE=$ROOT_SIZE"

            echo "DOWNLOAD_SIZE=$DOWNLOAD_SIZE"

            echo "BOOT_SHA512=$BOOT_SHA512"
            echo "ROOT_SHA512=$ROOT_SHA512"

          } >> "$GITHUB_ENV"

          # ------------------------------------------------------
          # Mounts entfernen
          # ------------------------------------------------------

          sudo umount "$ROOT"
          MOUNTED_ROOT=0

          sudo losetup -d "$ROOT_LOOPDEV"
          ROOT_LOOPDEV=""

          sudo umount "$BOOT"
          MOUNTED_BOOT=0

          sudo losetup -d "$BOOT_LOOPDEV"
          BOOT_LOOPDEV=""

          sudo losetup -d "$LOOPDEV"
          LOOPDEV=""

          echo
          echo "✅ Partitionen sauber ausgehängt."

      # ==========================================================
      # 9. DragonOS SHA256 dauerhaft speichern
      # ==========================================================

      - name: 🔐 DragonOS SHA256 zu SourceForge hochladen
        if: env.REUSE_BUILD != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          DEST="${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_CACHE}/"

          echo "==> Erzeuge Cache-Verzeichnis auf SourceForge"

          ssh \
            -F ~/.ssh/config \
            "$SF_HOST" \
            "mkdir -p /home/frs/project/${SF_PROJECT}/${SF_CACHE}"

          echo
          echo "==> Lade SHA256 hoch"

          rsync \
            -avP \
            -e "ssh -F ~/.ssh/config" \
            "${IMAGE_GZ}.sha256" \
            "$DEST"

      # ==========================================================
      # 10. PINN Tarballs zu SourceForge
      # ==========================================================

      - name: 🚀 PINN Tarballs zu SourceForge hochladen
        if: env.REUSE_BUILD != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          DEST="${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_RELEASE}/"

          echo "==> Upload nach:"
          echo "$DEST"

          rsync \
            -avP \
            --partial \
            -e "ssh -F ~/.ssh/config" \
            boot.tar.xz \
            root.tar.xz \
            "$DEST"

          echo
          echo "✅ PINN Tarballs erfolgreich hochgeladen."

      # ==========================================================
      # 11. Metadaten erzeugen
      # ==========================================================

      - name: 📝 PINN Metadaten erzeugen
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p dragonos

          # ------------------------------------------------------
          # Icon
          # ------------------------------------------------------

          if [[ ! -f dragonos/icon.png ]]; then
            echo "❌ dragonos/icon.png fehlt."
            exit 1
          fi

          cp \
            dragonos/icon.png \
            "dragonos/${OS_NAME}.png"

          # ------------------------------------------------------
          # Marketing
          # ------------------------------------------------------

          if [[ ! -f dragonos/slides_vga.png ]]; then
            echo "❌ dragonos/slides_vga.png fehlt."
            exit 1
          fi

          tar \
            -cJf dragonos/marketing.tar \
            -C dragonos \
            slides_vga.png

          # ------------------------------------------------------
          # partition_setup.sh
          # ------------------------------------------------------

          if [[ ! -f dragonos/partition_setup.sh ]]; then
            echo "❌ dragonos/partition_setup.sh fehlt."
            exit 1
          fi

          chmod +x dragonos/partition_setup.sh

          PARTITION_SETUP_SHA512=$(
            sha512sum dragonos/partition_setup.sh |
            awk '{print $1}'
          )

          # ------------------------------------------------------
          # partitions.json
          # ------------------------------------------------------

          jq -n \
            --arg boot_sha "$BOOT_SHA512" \
            --arg root_sha "$ROOT_SHA512" \
            --argjson boot_nominal "$BOOT_NOMINAL" \
            --argjson root_nominal "$ROOT_NOMINAL" \
            --argjson boot_raw "$BOOT_UNCOMPRESSED_MIB" \
            --argjson root_raw "$ROOT_UNCOMPRESSED_MIB" \
            '{
              partitions: [
                {
                  label: "dragon_boot",
                  filesystem_type: "fat",
                  partition_size_nominal: $boot_nominal,
                  want_maximised: false,
                  uncompressed_tarball_size: $boot_raw,
                  sha512sum: $boot_sha,
                  requires_partition_number: 1,
                  mkfs_options: "-F 32"
                },
                {
                  label: "dragon_root",
                  filesystem_type: "ext4",
                  partition_size_nominal: $root_nominal,
                  want_maximised: true,
                  uncompressed_tarball_size: $root_raw,
                  sha512sum: $root_sha,
                  requires_partition_number: 2
                }
              ]
            }' > dragonos/partitions.json

          # ------------------------------------------------------
          # os.json
          # ------------------------------------------------------

          jq -n \
            --arg name "$OS_NAME" \
            --arg version "$OS_VERSION" \
            --arg release_date "$(date -u +%Y-%m-%d)" \
            --arg desc "DragonOS Pi64 – SDR, Funkanalyse und Pentest" \
            --arg url "https://sourceforge.net/projects/dragonos-pi64/" \
            --arg sha "$PARTITION_SETUP_SHA512" \
            --argjson nominal "$NOMINAL_SIZE" \
            --argjson download "$DOWNLOAD_SIZE" \
            '{
              name: $name,
              description: $desc,
              release_date: $release_date,
              supported_models: [
                "Pi 4",
                "Pi Compute Module 4"
              ],
              supports_backup: false,
              nominal_size: $nominal,
              version: $version,
              url: $url,
              username: "dragon",
              password: "dragon",
              group: "Utility",
              download_size: $download,
              sha512sum: $sha
            }' > dragonos/os.json

          # ------------------------------------------------------
          # os_list_v3.json
          # ------------------------------------------------------

          SF_BASE="https://sourceforge.net/projects/${SF_PROJECT}/files/${SF_RELEASE}"

          jq -n \
            --arg name "$OS_NAME" \
            --arg version "$OS_VERSION" \
            --arg release_date "$(date -u +%Y-%m-%d)" \
            --arg desc "DragonOS Pi64 – SDR, Funkanalyse und Pentest" \
            --arg raw_base "$RAW_BASE" \
            --arg boot "${SF_BASE}/boot.tar.xz/download" \
            --arg root "${SF_BASE}/root.tar.xz/download" \
            --argjson nominal "$NOMINAL_SIZE" \
            --argjson download "$DOWNLOAD_SIZE" \
            '{
              os_list: [
                {
                  description: $desc,
                  download_size: $download,
                  group: "Utility",

                  icon: (
                    $raw_base +
                    "/" +
                    $name +
                    ".png"
                  ),

                  marketing_info: (
                    $raw_base +
                    "/marketing.tar"
                  ),

                  nominal_size: $nominal,

                  os_info: (
                    $raw_base +
                    "/os.json"
                  ),

                  os_name: $name,

                  partition_setup: (
                    $raw_base +
                    "/partition_setup.sh"
                  ),

                  partitions_info: (
                    $raw_base +
                    "/partitions.json"
                  ),

                  release_date: $release_date,

                  supported_models: [
                    "Pi 4",
                    "Pi Compute Module 4"
                  ],

                  supports_backup: false,

                  tarballs: [
                    $boot,
                    $root
                  ],

                  url: "https://sourceforge.net/projects/dragonos-pi64/",

                  username: "dragon",
                  password: "dragon",

                  version: $version
                }
              ]
            }' > os_list_v3.json

          # ------------------------------------------------------
          # JSON prüfen
          # ------------------------------------------------------

          jq empty dragonos/os.json
          jq empty dragonos/partitions.json
          jq empty os_list_v3.json

          echo
          echo "✅ JSON-Dateien sind gültig."

      # ==========================================================
      # 12. GitHub Metadaten committen
      # ==========================================================

      - name: 💾 PINN Metadaten nach GitHub committen
        shell: bash
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            dragonos/os.json \
            dragonos/partitions.json \
            dragonos/marketing.tar \
            "dragonos/${OS_NAME}.png" \
            os_list_v3.json

          if git diff --cached --quiet; then
            echo "ℹ️ Keine Änderungen."
            exit 0
          fi

          git commit \
            -m "🐉 Update DragonOS Pi64 PINN metadata ${OS_VERSION}"

          git push origin main

      # ==========================================================
      # 13. Zusammenfassung
      # ==========================================================

      - name: 📊 Build-Zusammenfassung
        if: always()
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo " DragonOS Pi64 → PINN"
          echo "=========================================="

          echo
          echo "Version:"
          echo "$OS_VERSION"

          echo
          echo "Build wiederverwendet:"
          echo "${REUSE_BUILD:-unbekannt}"

          echo
          echo "Boot Tarball:"
          [[ -f boot.tar.xz ]] && \
            ls -lh boot.tar.xz || true

          echo
          echo "Root Tarball:"
          [[ -f root.tar.xz ]] && \
            ls -lh root.tar.xz || true

          echo
          echo "Metadaten:"

          [[ -f dragonos/os.json ]] && \
            echo "  ✓ os.json"

          [[ -f dragonos/partitions.json ]] && \
            echo "  ✓ partitions.json"

          [[ -f os_list_v3.json ]] && \
            echo "  ✓ os_list_v3.json"

          [[ -f dragonos/marketing.tar ]] && \
            echo "  ✓ marketing.tar"

          [[ -f "dragonos/${OS_NAME}.png" ]] && \
            echo "  ✓ ${OS_NAME}.png"

          echo
          echo "=========================================="
