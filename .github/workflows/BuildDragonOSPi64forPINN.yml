name: 🐉 Build DragonOS Pi64 for PINN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  DRAGONOS_URL: "https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz/download"
  IMAGE_GZ: "DragonOS_Pi64_Beta42.img.gz"
  IMAGE: "DragonOS_Pi64_Beta42.img"

  SF_HOST: "frs.sourceforge.net"
  SF_PROJECT: "dragonos-pi64"
  SF_RELEASE: "PINN"

  OS_NAME: "DragonOS_Pi64"
  OS_VERSION: "Beta42"

  RAW_BASE: "https://raw.githubusercontent.com/loebi84/Pinn-Dragonos/main/dragonos"

jobs:
  build-pinn:
    runs-on: ubuntu-latest

    env:
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}

    steps:

      # ----------------------------------------------------------
      # 1. Repository
      # ----------------------------------------------------------

      - name: 📥 Repository klonen
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ----------------------------------------------------------
      # 2. Benötigte Tools
      # ----------------------------------------------------------

      - name: 🔧 Benötigte Tools installieren
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            gzip \
            xz-utils \
            parted \
            util-linux \
            e2fsprogs \
            dosfstools \
            rsync \
            jq \
            curl \
            openssh-client

      # ----------------------------------------------------------
      # 3. Speicherplatz prüfen
      # ----------------------------------------------------------

      - name: 💾 Speicherplatz prüfen
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Speicherplatz vor dem Download"
          df -h "$GITHUB_WORKSPACE"

      # ----------------------------------------------------------
      # 4. DragonOS herunterladen
      # ----------------------------------------------------------

      - name: 📥 DragonOS Pi64 Beta42 herunterladen
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Download DragonOS Pi64 Beta42"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 7200 \
            --progress-bar \
            --output "$IMAGE_GZ.tmp" \
            "$DRAGONOS_URL"

          echo
          echo "==> GZIP prüfen"

          gzip -t "$IMAGE_GZ.tmp"

          mv "$IMAGE_GZ.tmp" "$IMAGE_GZ"

          echo
          echo "Download erfolgreich:"
          ls -lh "$IMAGE_GZ"

      # ----------------------------------------------------------
      # 5. Image als Sparse-Image entpacken
      # ----------------------------------------------------------

      - name: 📦 DragonOS Image als Sparse-Image entpacken
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Entpacke $IMAGE_GZ als Sparse-Image"
          echo
          echo "Dadurch werden große Bereiche mit Nullen"
          echo "nicht physisch auf der Runner-Disk gespeichert."

          gzip -dc "$IMAGE_GZ" |
            cp --sparse=always /dev/stdin "$IMAGE.tmp"

          test -s "$IMAGE.tmp"

          mv "$IMAGE.tmp" "$IMAGE"

          echo
          echo "==> Image-Typ:"
          file "$IMAGE"

          echo
          echo "==> Physischer Speicherverbrauch:"
          du -h "$IMAGE"

          echo
          echo "==> Logische Größe:"
          ls -lh "$IMAGE"

          # Die komprimierte 5-GB-Datei wird ab hier nicht mehr benötigt.
          rm -f "$IMAGE_GZ"

          echo
          echo "==> Speicherplatz nach dem Entpacken:"
          df -h "$GITHUB_WORKSPACE"

      # ----------------------------------------------------------
      # 6. Partitionen erkennen und PINN-Tarballs erzeugen
      # ----------------------------------------------------------

      - name: 🔍 Partitionen erkennen und PINN-Tarballs erzeugen
        shell: bash
        run: |
          set -Eeuo pipefail

          WORK="$PWD/work"
          BOOT="$WORK/boot"
          ROOT="$WORK/root"

          mkdir -p "$BOOT" "$ROOT"

          MOUNTED_BOOT=0
          MOUNTED_ROOT=0
          LOOPDEV=""

          cleanup() {
            local status=$?

            set +e

            if (( MOUNTED_ROOT )); then
              sudo umount "$ROOT" 2>/dev/null || \
                sudo umount -l "$ROOT" 2>/dev/null || true

              MOUNTED_ROOT=0
            fi

            if (( MOUNTED_BOOT )); then
              sudo umount "$BOOT" 2>/dev/null || \
                sudo umount -l "$BOOT" 2>/dev/null || true

              MOUNTED_BOOT=0
            fi

            if [[ -n "$LOOPDEV" ]]; then
              sudo losetup -d "$LOOPDEV" 2>/dev/null || true
              LOOPDEV=""
            fi

            exit "$status"
          }

          trap cleanup EXIT

          # ------------------------------------------------------
          # Image prüfen
          # ------------------------------------------------------

          if [[ ! -s "$IMAGE" ]]; then
            echo "❌ Image fehlt oder ist leer:"
            echo "$IMAGE"
            exit 1
          fi

          # ------------------------------------------------------
          # Loopdevice für Sektorgröße
          # ------------------------------------------------------

          LOOPDEV=$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              "$IMAGE"
          )

          echo "Loopdevice: $LOOPDEV"

          SECTOR_SIZE=$(
            sudo blockdev --getss "$LOOPDEV"
          )

          if [[ ! "$SECTOR_SIZE" =~ ^[0-9]+$ ]]; then
            echo "❌ Ungültige Sektorgröße:"
            echo "$SECTOR_SIZE"
            exit 1
          fi

          echo "Sektorgröße: $SECTOR_SIZE Bytes"

          # ------------------------------------------------------
          # Partitionstabelle
          # ------------------------------------------------------

          echo
          echo "=============================="
          echo "Partitionstabelle"
          echo "=============================="

          sudo parted -s "$IMAGE" unit s print

          PARTED_OUTPUT=$(
            sudo parted -ms "$IMAGE" unit s print
          )

          PARTITION_LINES=$(
            printf '%s\n' "$PARTED_OUTPUT" |
              awk -F: '$1 ~ /^[0-9]+$/'
          )

          if [[ -z "$PARTITION_LINES" ]]; then
            echo "❌ Keine Partitionen gefunden."
            exit 1
          fi

          echo
          echo "Machine-readable Partitionen:"
          echo "$PARTITION_LINES"

          # ------------------------------------------------------
          # Hilfsfunktionen
          # ------------------------------------------------------

          get_partition_field() {
            local number="$1"
            local field="$2"

            printf '%s\n' "$PARTITION_LINES" |
              awk -F: \
                -v n="$number" \
                -v f="$field" '
                  $1 == n {
                    value = $f
                    sub(/s$/, "", value)
                    print value
                    exit
                  }
                '
          }

          get_partition_fs() {
            local number="$1"

            printf '%s\n' "$PARTITION_LINES" |
              awk -F: \
                -v n="$number" '
                  $1 == n {
                    print tolower($5)
                    exit
                  }
                '
          }

          # ------------------------------------------------------
          # Boot und Root erkennen
          # ------------------------------------------------------

          BOOT_PARTITION=""
          ROOT_PARTITION=""

          while IFS= read -r line; do

            [[ -z "$line" ]] && continue

            NUMBER=$(
              printf '%s\n' "$line" |
                cut -d: -f1
            )

            FILESYSTEM=$(
              printf '%s\n' "$line" |
                cut -d: -f5 |
                tr '[:upper:]' '[:lower:]'
            )

            case "$FILESYSTEM" in

              fat|fat16|fat32|vfat)

                if [[ -z "$BOOT_PARTITION" ]]; then
                  BOOT_PARTITION="$NUMBER"
                fi

                ;;

              ext2|ext3|ext4)

                if [[ -z "$ROOT_PARTITION" ]]; then
                  ROOT_PARTITION="$NUMBER"
                fi

                ;;

            esac

          done <<< "$PARTITION_LINES"

          # ------------------------------------------------------
          # PINN verlangt p1 = boot und p2 = root
          # ------------------------------------------------------

          if [[ "$BOOT_PARTITION" != "1" ]]; then
            echo "❌ FAT-Bootpartition ist nicht Partition 1."
            echo "Gefunden: $BOOT_PARTITION"
            exit 1
          fi

          if [[ "$ROOT_PARTITION" != "2" ]]; then
            echo "❌ ext-Rootpartition ist nicht Partition 2."
            echo "Gefunden: $ROOT_PARTITION"
            exit 1
          fi

          BOOT_FS=$(
            get_partition_fs "$BOOT_PARTITION"
          )

          ROOT_FS=$(
            get_partition_fs "$ROOT_PARTITION"
          )

          BOOT_START=$(
            get_partition_field "$BOOT_PARTITION" 2
          )

          BOOT_END=$(
            get_partition_field "$BOOT_PARTITION" 3
          )

          ROOT_START=$(
            get_partition_field "$ROOT_PARTITION" 2
          )

          ROOT_END=$(
            get_partition_field "$ROOT_PARTITION" 3
          )

          # ------------------------------------------------------
          # Werte prüfen
          # ------------------------------------------------------

          for VALUE_NAME in \
            BOOT_START \
            BOOT_END \
            ROOT_START \
            ROOT_END
          do

            VALUE="${!VALUE_NAME}"

            if [[ ! "$VALUE" =~ ^[0-9]+$ ]]; then
              echo "❌ Ungültiger Wert:"
              echo "$VALUE_NAME=$VALUE"
              exit 1
            fi

          done

          # ------------------------------------------------------
          # Größen berechnen
          # ------------------------------------------------------

          BOOT_SECTORS=$((BOOT_END - BOOT_START + 1))
          ROOT_SECTORS=$((ROOT_END - ROOT_START + 1))

          BOOT_PARTITION_BYTES=$((BOOT_SECTORS * SECTOR_SIZE))
          ROOT_PARTITION_BYTES=$((ROOT_SECTORS * SECTOR_SIZE))

          BOOT_PARTITION_MIB=$((BOOT_PARTITION_BYTES / 1024 / 1024))
          ROOT_PARTITION_MIB=$((ROOT_PARTITION_BYTES / 1024 / 1024))

          BOOT_OFFSET=$((BOOT_START * SECTOR_SIZE))
          ROOT_OFFSET=$((ROOT_START * SECTOR_SIZE))


          

          echo
          echo "=============================="
          echo "Erkannte Partitionen"
          echo "=============================="

          echo
          echo "BOOT"
          echo "  Nummer : $BOOT_PARTITION"
          echo "  FS     : $BOOT_FS"
          echo "  Start  : $BOOT_START"
          echo "  Ende   : $BOOT_END"
          echo "  Größe  : ${BOOT_PARTITION_MIB} MiB"
          echo "  Offset : $BOOT_OFFSET"

          echo
          echo "ROOT"
          echo "  Nummer : $ROOT_PARTITION"
          echo "  FS     : $ROOT_FS"
          echo "  Start  : $ROOT_START"
          echo "  Ende   : $ROOT_END"
          echo "  Größe  : ${ROOT_PARTITION_MIB} MiB"
          echo "  Offset : $ROOT_OFFSET"

          # ------------------------------------------------------
          # Root Mindestgröße
          # ------------------------------------------------------

          if (( ROOT_PARTITION_BYTES < 1024 * 1024 * 1024 )); then
            echo "❌ Root-Partition ist kleiner als 1 GiB."
            exit 1
          fi

          # ------------------------------------------------------
          # Boot readonly mounten
          # ------------------------------------------------------

          echo
          echo "==> Mount Boot readonly"

          sudo mount \
            -o loop,ro,offset="$BOOT_OFFSET" \
            "$IMAGE" \
            "$BOOT"

          MOUNTED_BOOT=1

          # ------------------------------------------------------
          # Root readonly mounten
          # ------------------------------------------------------

          echo
          echo "==> Mount Root readonly"

          sudo mount \
            -o loop,ro,noload,offset="$ROOT_OFFSET" \
            "$IMAGE" \
            "$ROOT"

          MOUNTED_ROOT=1

          # ------------------------------------------------------
          # Root-Struktur prüfen
          # ------------------------------------------------------

          echo
          echo "==> Prüfe Root-Dateisystem"

          for DIR in etc usr var; do

            if [[ ! -d "$ROOT/$DIR" ]]; then

              echo "❌ Root-Partition ungültig:"
              echo "$ROOT/$DIR fehlt."

              exit 1

            fi

          done

          echo "✅ Root-Partition erfolgreich verifiziert."

          # ------------------------------------------------------
          # Boot Tarball
          # ------------------------------------------------------

          echo
          echo "==> Erzeuge boot.tar.xz"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            -C "$BOOT" \
            -cJf boot.tar.xz .

          # ------------------------------------------------------
          # Root Tarball
          # ------------------------------------------------------

          echo
          echo "==> Erzeuge root.tar.xz"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            --exclude="./lost+found" \
            -C "$ROOT" \
            -cJf root.tar.xz .

          # ------------------------------------------------------
          # Tarballs prüfen
          # ------------------------------------------------------

          echo
          echo "==> Prüfe boot.tar.xz"

          xz -t boot.tar.xz
          tar -tJf boot.tar.xz >/dev/null

          echo "✅ boot.tar.xz OK"

          echo
          echo "==> Prüfe root.tar.xz"

          xz -t root.tar.xz
          tar -tJf root.tar.xz >/dev/null

          echo "✅ root.tar.xz OK"

          # ------------------------------------------------------
          # Unkomprimierte Tarball-Größe
          # ------------------------------------------------------

          echo
          echo "==> Ermittle unkomprimierte Größen"

          BOOT_RAW_BYTES=$(
            sudo tar \
              --xattrs \
              --acls \
              --numeric-owner \
              --one-file-system \
              -C "$BOOT" \
              -cf - . |
              wc -c
          )

          ROOT_RAW_BYTES=$(
            sudo tar \
              --xattrs \
              --acls \
              --numeric-owner \
              --one-file-system \
              --exclude="./lost+found" \
              -C "$ROOT" \
              -cf - . |
              wc -c
          )

          BOOT_UNCOMPRESSED_MIB=$(( (BOOT_RAW_BYTES + 1024 * 1024 - 1) / 1024 / 1024 ))

          ROOT_UNCOMPRESSED_MIB=$(( (ROOT_RAW_BYTES + 1024 * 1024 - 1) / 1024 / 1024 ))

          BOOT_NOMINAL=$((BOOT_UNCOMPRESSED_MIB + 100))

          ROOT_NOMINAL=$((ROOT_UNCOMPRESSED_MIB + 500))

          NOMINAL_SIZE=$((BOOT_NOMINAL + ROOT_NOMINAL))

          DOWNLOAD_SIZE=$((BOOT_SIZE + ROOT_SIZE))

          

          # ------------------------------------------------------
          # Tarball Größen / Checksums
          # ------------------------------------------------------

          BOOT_SIZE=$(
            stat -c%s boot.tar.xz
          )

          ROOT_SIZE=$(
            stat -c%s root.tar.xz
          )

          DOWNLOAD_SIZE=$(
            (BOOT_SIZE + ROOT_SIZE)
          )

          BOOT_SHA512=$(
            sha512sum boot.tar.xz |
              awk '{print $1}'
          )

          ROOT_SHA512=$(
            sha512sum root.tar.xz |
              awk '{print $1}'
          )

          # ------------------------------------------------------
          # Ausgabe
          # ------------------------------------------------------

          echo
          echo "=============================="
          echo "PINN Build Ergebnis"
          echo "=============================="

          echo "Boot uncompressed : ${BOOT_UNCOMPRESSED_MIB} MiB"
          echo "Root uncompressed : ${ROOT_UNCOMPRESSED_MIB} MiB"

          echo
          echo "Boot nominal      : ${BOOT_NOMINAL} MiB"
          echo "Root nominal      : ${ROOT_NOMINAL} MiB"

          echo
          echo "Nominal size      : ${NOMINAL_SIZE} MiB"

          echo
          echo "Boot tarball      : ${BOOT_SIZE} Bytes"
          echo "Root tarball      : ${ROOT_SIZE} Bytes"

          echo
          echo "Download size     : ${DOWNLOAD_SIZE} Bytes"

          echo
          echo "Boot SHA512:"
          echo "$BOOT_SHA512"

          echo
          echo "Root SHA512:"
          echo "$ROOT_SHA512"

          # ------------------------------------------------------
          # Werte exportieren
          # ------------------------------------------------------

          {
            echo "BOOT_PARTITION_MIB=$BOOT_PARTITION_MIB"
            echo "ROOT_PARTITION_MIB=$ROOT_PARTITION_MIB"

            echo "BOOT_RAW_BYTES=$BOOT_RAW_BYTES"
            echo "ROOT_RAW_BYTES=$ROOT_RAW_BYTES"

            echo "BOOT_UNCOMPRESSED_MIB=$BOOT_UNCOMPRESSED_MIB"
            echo "ROOT_UNCOMPRESSED_MIB=$ROOT_UNCOMPRESSED_MIB"

            echo "BOOT_NOMINAL=$BOOT_NOMINAL"
            echo "ROOT_NOMINAL=$ROOT_NOMINAL"

            echo "NOMINAL_SIZE=$NOMINAL_SIZE"

            echo "BOOT_SIZE=$BOOT_SIZE"
            echo "ROOT_SIZE=$ROOT_SIZE"

            echo "DOWNLOAD_SIZE=$DOWNLOAD_SIZE"

            echo "BOOT_SHA512=$BOOT_SHA512"
            echo "ROOT_SHA512=$ROOT_SHA512"
          } >> "$GITHUB_ENV"

          # ------------------------------------------------------
          # Mounts sauber entfernen
          # ------------------------------------------------------

          sudo umount "$ROOT"
          MOUNTED_ROOT=0

          sudo umount "$BOOT"
          MOUNTED_BOOT=0

          sudo losetup -d "$LOOPDEV"
          LOOPDEV=""

          # Das große Image wird nicht mehr benötigt.
          rm -f "$IMAGE"

          echo
          echo "==> Speicherplatz nach Tarball-Erzeugung:"
          df -h "$GITHUB_WORKSPACE"

      # ----------------------------------------------------------
      # 7. PINN Metadaten erzeugen
      # ----------------------------------------------------------

      - name: 📝 PINN Metadaten erzeugen
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p dragonos

          # ------------------------------------------------------
          # Icon
          # ------------------------------------------------------

          if [[ ! -f dragonos/icon.png ]]; then
            echo "❌ dragonos/icon.png fehlt."
            exit 1
          fi

          cp \
            dragonos/icon.png \
            "dragonos/${OS_NAME}.png"

          # ------------------------------------------------------
          # Marketing
          # ------------------------------------------------------

          if [[ ! -f dragonos/slides_vga.png ]]; then
            echo "❌ dragonos/slides_vga.png fehlt."
            exit 1
          fi

          tar \
            -cJf dragonos/marketing.tar \
            -C dragonos \
            slides_vga.png

          # ------------------------------------------------------
          # partition_setup.sh
          # ------------------------------------------------------

          if [[ ! -f dragonos/partition_setup.sh ]]; then
            echo "❌ dragonos/partition_setup.sh fehlt."
            exit 1
          fi

          chmod +x dragonos/partition_setup.sh

          PARTITION_SETUP_SHA512=$(
            sha512sum dragonos/partition_setup.sh |
              awk '{print $1}'
          )

          # ------------------------------------------------------
          # partitions.json
          # ------------------------------------------------------

          jq -n \
            --arg boot_sha "$BOOT_SHA512" \
            --arg root_sha "$ROOT_SHA512" \
            --argjson boot_nominal "$BOOT_NOMINAL" \
            --argjson root_nominal "$ROOT_NOMINAL" \
            --argjson boot_raw "$BOOT_UNCOMPRESSED_MIB" \
            --argjson root_raw "$ROOT_UNCOMPRESSED_MIB" \
            '{
              partitions: [
                {
                  label: "dragon_boot",
                  filesystem_type: "fat",
                  partition_size_nominal: $boot_nominal,
                  want_maximised: false,
                  uncompressed_tarball_size: $boot_raw,
                  sha512sum: $boot_sha,
                  requires_partition_number: 1,
                  mkfs_options: "-F 32"
                },
                {
                  label: "dragon_root",
                  filesystem_type: "ext4",
                  partition_size_nominal: $root_nominal,
                  want_maximised: true,
                  uncompressed_tarball_size: $root_raw,
                  sha512sum: $root_sha,
                  requires_partition_number: 2
                }
              ]
            }' > dragonos/partitions.json

          # ------------------------------------------------------
          # os.json
          # ------------------------------------------------------

          jq -n \
            --arg name "$OS_NAME" \
            --arg version "$OS_VERSION" \
            --arg release_date "$(date -u +%Y-%m-%d)" \
            --arg desc "DragonOS Pi64 – SDR, Funkanalyse und Pentest" \
            --arg url "https://sourceforge.net/projects/dragonos-pi64/" \
            --arg sha "$PARTITION_SETUP_SHA512" \
            --argjson nominal "$NOMINAL_SIZE" \
            --argjson download "$DOWNLOAD_SIZE" \
            '{
              name: $name,
              description: $desc,
              release_date: $release_date,
              supported_models: [
                "Pi 4",
                "Pi Compute Module 4"
              ],
              supports_backup: false,
              nominal_size: $nominal,
              version: $version,
              url: $url,
              username: "dragon",
              password: "dragon",
              group: "Utility",
              download_size: $download,
              sha512sum: $sha
            }' > dragonos/os.json

          # ------------------------------------------------------
          # os_list_v3.json
          # ------------------------------------------------------

          SF_BASE="https://sourceforge.net/projects/${SF_PROJECT}/files/${SF_RELEASE}"

          jq -n \
            --arg name "$OS_NAME" \
            --arg version "$OS_VERSION" \
            --arg release_date "$(date -u +%Y-%m-%d)" \
            --arg desc "DragonOS Pi64 – SDR, Funkanalyse und Pentest" \
            --arg raw_base "$RAW_BASE" \
            --arg boot "${SF_BASE}/boot.tar.xz/download" \
            --arg root "${SF_BASE}/root.tar.xz/download" \
            --argjson nominal "$NOMINAL_SIZE" \
            --argjson download "$DOWNLOAD_SIZE" \
            '{
              os_list: [
                {
                  description: $desc,
                  download_size: $download,
                  group: "Utility",

                  icon: (
                    $raw_base +
                    "/" +
                    $name +
                    ".png"
                  ),

                  marketing_info: (
                    $raw_base +
                    "/marketing.tar"
                  ),

                  nominal_size: $nominal,

                  os_info: (
                    $raw_base +
                    "/os.json"
                  ),

                  os_name: $name,

                  partition_setup: (
                    $raw_base +
                    "/partition_setup.sh"
                  ),

                  partitions_info: (
                    $raw_base +
                    "/partitions.json"
                  ),

                  release_date: $release_date,

                  supported_models: [
                    "Pi 4",
                    "Pi Compute Module 4"
                  ],

                  supports_backup: false,

                  tarballs: [
                    $boot,
                    $root
                  ],

                  url: "https://sourceforge.net/projects/dragonos-pi64/",

                  username: "dragon",
                  password: "dragon",

                  version: $version
                }
              ]
            }' > os_list_v3.json

          # ------------------------------------------------------
          # JSON validieren
          # ------------------------------------------------------

          echo
          echo "==> JSON prüfen"

          jq empty dragonos/os.json
          jq empty dragonos/partitions.json
          jq empty os_list_v3.json

          echo "✅ Alle PINN JSON-Dateien sind gültig."

          echo
          echo "===== os.json ====="
          jq . dragonos/os.json

          echo
          echo "===== partitions.json ====="
          jq . dragonos/partitions.json

          echo
          echo "===== os_list_v3.json ====="
          jq . os_list_v3.json

      # ----------------------------------------------------------
      # 8. SourceForge Secrets prüfen
      # ----------------------------------------------------------

      - name: 🔐 SourceForge Secrets prüfen
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$SF_USERNAME" ]]; then
            echo "❌ Secret SF_USERNAME fehlt."
            exit 1
          fi

          if [[ -z "$SF_SSH_KEY" ]]; then
            echo "❌ Secret SF_SSH_KEY fehlt."
            exit 1
          fi

          echo "✅ SourceForge Secrets vorhanden."

      # ----------------------------------------------------------
      # 9. SourceForge SSH vorbereiten
      # ----------------------------------------------------------

      - name: 🔐 SourceForge SSH vorbereiten
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SF_SSH_KEY" \
            > ~/.ssh/sourceforge_key

          chmod 600 ~/.ssh/sourceforge_key

          ssh-keyscan -H "$SF_HOST" \
            >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host $SF_HOST
            HostName $SF_HOST
            User $SF_USERNAME
            IdentityFile ~/.ssh/sourceforge_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

          echo "✅ SourceForge SSH vorbereitet."

      # ----------------------------------------------------------
      # 10. Tarballs nach SourceForge hochladen
      # ----------------------------------------------------------

      - name: 🚀 PINN Tarballs zu SourceForge hochladen
        shell: bash
        run: |
          set -Eeuo pipefail

          DEST="${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_RELEASE}/"

          echo "==> Upload nach:"
          echo "$DEST"

          rsync \
            -avP \
            --partial \
            -e "ssh -F ~/.ssh/config" \
            boot.tar.xz \
            root.tar.xz \
            "$DEST"

          echo
          echo "✅ Tarballs erfolgreich zu SourceForge übertragen."

      # ----------------------------------------------------------
      # 11. Metadaten nach GitHub committen
      # ----------------------------------------------------------

      - name: 💾 PINN Metadaten nach GitHub committen
        shell: bash
        run: |
          set -Eeuo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            dragonos/os.json \
            dragonos/partitions.json \
            dragonos/marketing.tar \
            "dragonos/${OS_NAME}.png" \
            os_list_v3.json

          if git diff --cached --quiet; then
            echo "ℹ️ Keine Änderungen an den Metadaten."
            exit 0
          fi

          git commit \
            -m "🐉 Update DragonOS Pi64 PINN metadata ${OS_VERSION}"

          git push origin main

          echo
          echo "✅ PINN-Metadaten nach main gepusht."

      # ----------------------------------------------------------
      # 12. Build-Zusammenfassung
      # ----------------------------------------------------------

      - name: 📊 Build-Zusammenfassung
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " DragonOS Pi64 → PINN"
          echo "=========================================="

          echo
          echo "Version:"
          echo "$OS_VERSION"

          echo
          echo "Boot Tarball:"
          [[ -f boot.tar.xz ]] && \
            ls -lh boot.tar.xz || true

          echo
          echo "Root Tarball:"
          [[ -f root.tar.xz ]] && \
            ls -lh root.tar.xz || true

          echo
          echo "Metadaten:"

          [[ -f dragonos/os.json ]] && \
            echo "  ✓ os.json"

          [[ -f dragonos/partitions.json ]] && \
            echo "  ✓ partitions.json"

          [[ -f os_list_v3.json ]] && \
            echo "  ✓ os_list_v3.json"

          [[ -f dragonos/marketing.tar ]] && \
            echo "  ✓ marketing.tar"

          [[ -f "dragonos/${OS_NAME}.png" ]] && \
            echo "  ✓ ${OS_NAME}.png"

          echo
          echo "=========================================="
