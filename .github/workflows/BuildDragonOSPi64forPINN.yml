name: 🐉 Build DragonOS Pi64 for PINN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  DRAGONOS_VERSION: "Beta42"
  DRAGONOS_URL: "https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz/download"

  IMAGE_GZ: "DragonOS_Pi64_Beta42.img.gz"
  IMAGE: "DragonOS_Pi64_Beta42.img"

  RELEASE_TAG: "dragonos-pi64-beta42"

jobs:
  build-pinn:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Repository
      # ============================================================

      - name: 📥 Repository klonen
        uses: actions/checkout@v4

      # ============================================================
      # Werkzeuge
      # ============================================================

      - name: 🔧 Werkzeuge installieren
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            parted \
            xz-utils \
            gzip \
            jq \
            util-linux

      # ============================================================
      # DragonOS Image Cache
      # ============================================================

      - name: 💾 DragonOS Image Cache
        id: dragonos-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.IMAGE_GZ }}
          key: dragonos-pi64-${{ env.DRAGONOS_VERSION }}-img-gz-v1

      # ============================================================
      # DragonOS herunterladen
      # ============================================================

      - name: 📥 DragonOS Pi64 herunterladen
        if: steps.dragonos-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Kein Cache gefunden."
          echo "Lade DragonOS Pi64 ${DRAGONOS_VERSION} herunter..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --connect-timeout 30 \
            --output "$IMAGE_GZ" \
            "$DRAGONOS_URL"

          echo
          echo "Download abgeschlossen:"
          ls -lh "$IMAGE_GZ"

      # ============================================================
      # Offizielle SHA256 von SourceForge laden
      # ============================================================

      - name: 🔐 Offizielle SHA256-Prüfsumme laden
        shell: bash
        run: |
          set -euo pipefail

          SHA256_URL="https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz.SHA256.txt/download"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --connect-timeout 30 \
            --output DragonOS_Pi64_Beta42.img.gz.SHA256.txt \
            "$SHA256_URL"

          echo
          echo "===== Offizielle SHA256-Datei ====="
          cat DragonOS_Pi64_Beta42.img.gz.SHA256.txt

          EXPECTED_SHA256="$(
            awk '
              NF >= 1 &&
              $1 ~ /^[0-9a-fA-F]{64}$/ {
                print tolower($1)
                exit
              }
            ' DragonOS_Pi64_Beta42.img.gz.SHA256.txt
          )"

          if [[ -z "$EXPECTED_SHA256" ]]; then
            echo
            echo "❌ Keine gültige SHA256-Prüfsumme gefunden."
            exit 1
          fi

          echo
          echo "Offizielle SHA256:"
          echo "$EXPECTED_SHA256"

          echo "DRAGONOS_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"

      # ============================================================
      # SHA256 prüfen
      # ============================================================

      - name: 🔐 DragonOS Image SHA256 prüfen
        shell: bash
        run: |
          set -euo pipefail

          echo "Berechne SHA256..."

          ACTUAL_SHA256="$(
            sha256sum "$IMAGE_GZ" |
            awk '{print tolower($1)}'
          )"

          echo
          echo "Erwartet:"
          echo "$DRAGONOS_SHA256"

          echo
          echo "Gefunden:"
          echo "$ACTUAL_SHA256"

          if [[ "$ACTUAL_SHA256" != "$DRAGONOS_SHA256" ]]; then
            echo
            echo "❌ SHA256-Prüfung fehlgeschlagen!"
            exit 1
          fi

          echo
          echo "✅ SHA256 ist korrekt."

      # ============================================================
      # Image entpacken
      # ============================================================

      - name: 📦 DragonOS Image entpacken
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$IMAGE" ]]; then
            echo "Image ist bereits vorhanden."
          else
            echo "Entpacke $IMAGE_GZ ..."

            gzip -dc "$IMAGE_GZ" > "$IMAGE"
          fi

          echo
          echo "DragonOS Image:"
          ls -lh "$IMAGE"

      # ============================================================
      # PINN Tarballs erzeugen
      # ============================================================

      - name: 🔧 PINN Tarballs erzeugen
        shell: bash
        run: |
          set -euo pipefail

          WORK="$PWD/work"
          BOOT="$WORK/boot"
          ROOT="$WORK/root"

          mkdir -p "$BOOT" "$ROOT"

          LOOPDEV=""
          BOOT_LOOPDEV=""
          ROOT_LOOPDEV=""

          cleanup() {
            set +e

            echo
            echo "==> Cleanup"

            sudo umount "$BOOT" 2>/dev/null || true
            sudo umount "$ROOT" 2>/dev/null || true

            if [[ -n "$BOOT_LOOPDEV" ]]; then
              sudo losetup -d "$BOOT_LOOPDEV" 2>/dev/null || true
            fi

            if [[ -n "$ROOT_LOOPDEV" ]]; then
              sudo losetup -d "$ROOT_LOOPDEV" 2>/dev/null || true
            fi

            if [[ -n "$LOOPDEV" ]]; then
              sudo losetup -d "$LOOPDEV" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          # ========================================================
          # Haupt-Loopdevice
          # ========================================================

          echo
          echo "==> Loopdevice erstellen"

          LOOPDEV="$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              "$IMAGE"
          )"

          echo "Loopdevice: $LOOPDEV"

          SECTOR_SIZE="$(
            sudo blockdev --getss "$LOOPDEV"
          )"

          echo "Sektorgröße: $SECTOR_SIZE Bytes"

          # ========================================================
          # Partitionstabelle
          # ========================================================

          echo
          echo "===== Partitionstabelle ====="

          sudo parted -s "$LOOPDEV" unit s print

          PART1="$(
            sudo parted -ms "$LOOPDEV" unit s print |
            awk -F: '$1 == "1" {print}'
          )"

          PART2="$(
            sudo parted -ms "$LOOPDEV" unit s print |
            awk -F: '$1 == "2" {print}'
          )"

          if [[ -z "$PART1" ]]; then
            echo "❌ Partition 1 wurde nicht gefunden."
            exit 1
          fi

          if [[ -z "$PART2" ]]; then
            echo "❌ Partition 2 wurde nicht gefunden."
            exit 1
          fi

          echo
          echo "Partition 1:"
          echo "$PART1"

          echo
          echo "Partition 2:"
          echo "$PART2"

          # ========================================================
          # Partitionen auslesen
          # ========================================================

          PART1_FS="$(echo "$PART1" | cut -d: -f6)"
          PART2_FS="$(echo "$PART2" | cut -d: -f6)"

          PART1_START="$(
            echo "$PART1" |
            cut -d: -f2 |
            sed 's/s$//'
          )"

          PART1_END="$(
            echo "$PART1" |
            cut -d: -f3 |
            sed 's/s$//'
          )"

          PART2_START="$(
            echo "$PART2" |
            cut -d: -f2 |
            sed 's/s$//'
          )"

          PART2_END="$(
            echo "$PART2" |
            cut -d: -f3 |
            sed 's/s$//'
          )"

          # ========================================================
          # Partitionstypen prüfen
          # ========================================================

          PART1_FS_LOWER="$(echo "$PART1_FS" | tr '[:upper:]' '[:lower:]')"
          PART2_FS_LOWER="$(echo "$PART2_FS" | tr '[:upper:]' '[:lower:]')"

          if [[ "$PART1_FS_LOWER" != "fat32" &&
                "$PART1_FS_LOWER" != "fat16" &&
                "$PART1_FS_LOWER" != "fat" ]]; then

            echo "❌ Partition 1 ist kein FAT-Dateisystem."
            echo "Gefunden: $PART1_FS"
            exit 1
          fi

          if [[ "$PART2_FS_LOWER" != "ext4" &&
                "$PART2_FS_LOWER" != "ext3" &&
                "$PART2_FS_LOWER" != "ext2" ]]; then

            echo "❌ Partition 2 ist kein Linux-Dateisystem."
            echo "Gefunden: $PART2_FS"
            exit 1
          fi

          # ========================================================
          # Größen berechnen
          # ========================================================

          BOOT_SECTORS=$((PART1_END - PART1_START + 1))
          ROOT_SECTORS=$((PART2_END - PART2_START + 1))

          BOOT_PARTITION_BYTES=$((BOOT_SECTORS * SECTOR_SIZE))
          ROOT_PARTITION_BYTES=$((ROOT_SECTORS * SECTOR_SIZE))

          BOOT_PARTITION_MIB=$(
            (BOOT_PARTITION_BYTES / 1024 / 1024)
          )

          ROOT_PARTITION_MIB=$(
            (ROOT_PARTITION_BYTES / 1024 / 1024)
          )

          BOOT_OFFSET=$((PART1_START * SECTOR_SIZE))
          ROOT_OFFSET=$((PART2_START * SECTOR_SIZE))

          echo
          echo "===== Partitionen ====="

          echo
          echo "BOOT"
          echo "  Start      : $PART1_START"
          echo "  Ende       : $PART1_END"
          echo "  Sektoren   : $BOOT_SECTORS"
          echo "  Größe      : $BOOT_PARTITION_MIB MiB"
          echo "  Offset     : $BOOT_OFFSET Bytes"
          echo "  Filesystem : $PART1_FS"

          echo
          echo "ROOT"
          echo "  Start      : $PART2_START"
          echo "  Ende       : $PART2_END"
          echo "  Sektoren   : $ROOT_SECTORS"
          echo "  Größe      : $ROOT_PARTITION_MIB MiB"
          echo "  Offset     : $ROOT_OFFSET Bytes"
          echo "  Filesystem : $PART2_FS"

          # ========================================================
          # Separate Loopdevice für BOOT
          # ========================================================

          echo
          echo "==> Boot Loopdevice erstellen"

          BOOT_LOOPDEV="$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              --offset "$BOOT_OFFSET" \
              --sizelimit "$BOOT_PARTITION_BYTES" \
              "$IMAGE"
          )"

          echo "BOOT Loopdevice: $BOOT_LOOPDEV"

          # ========================================================
          # Separate Loopdevice für ROOT
          # ========================================================

          echo
          echo "==> Root Loopdevice erstellen"

          ROOT_LOOPDEV="$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              --offset "$ROOT_OFFSET" \
              --sizelimit "$ROOT_PARTITION_BYTES" \
              "$IMAGE"
          )"

          echo "ROOT Loopdevice: $ROOT_LOOPDEV"

          # ========================================================
          # Mount
          #
          # KEIN mount -o loop!
          # ========================================================

          echo
          echo "==> Mount Boot readonly"

          sudo mount \
            -o ro \
            "$BOOT_LOOPDEV" \
            "$BOOT"

          echo
          echo "==> Mount Root readonly"

          sudo mount \
            -o ro \
            "$ROOT_LOOPDEV" \
            "$ROOT"

          # ========================================================
          # Dateien prüfen
          # ========================================================

          echo
          echo "===== BOOT ====="

          sudo ls -la "$BOOT" | head -40

          echo
          echo "===== ROOT ====="

          sudo ls -la "$ROOT" | head -40

          for DIR in bin etc usr var; do
            if [[ ! -d "$ROOT/$DIR" ]]; then
              echo
              echo "❌ Root-Dateisystem ungültig."
              echo "Fehlendes Verzeichnis: $ROOT/$DIR"
              exit 1
            fi
          done

          echo
          echo "✅ Root-Dateisystem erkannt."

          # ========================================================
          # Dateigrößen VOR dem Unmount ermitteln
          # ========================================================

          BOOT_RAW_BYTES="$(
            sudo du -sb "$BOOT" |
            awk '{print $1}'
          )"

          ROOT_RAW_BYTES="$(
            sudo du -sb "$ROOT" |
            awk '{print $1}'
          )"

          BOOT_UNCOMPRESSED_MIB=$(
            (
              BOOT_RAW_BYTES + 1024 * 1024 - 1
            ) / 1024 / 1024
          )

          ROOT_UNCOMPRESSED_MIB=$(
            (
              ROOT_RAW_BYTES + 1024 * 1024 - 1
            ) / 1024 / 1024
          )

          # ========================================================
          # Tarballs
          # ========================================================

          echo
          echo "==> boot.tar.xz erzeugen"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            -C "$BOOT" \
            -cJf "$PWD/boot.tar.xz" \
            .

          echo
          echo "==> root.tar.xz erzeugen"

          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            --exclude="./lost+found" \
            -C "$ROOT" \
            -cJf "$PWD/root.tar.xz" \
            .

          # ========================================================
          # Unmount
          # ========================================================

          echo
          echo "==> Unmount"

          sudo umount "$BOOT"
          sudo umount "$ROOT"

          sudo losetup -d "$BOOT_LOOPDEV"
          BOOT_LOOPDEV=""

          sudo losetup -d "$ROOT_LOOPDEV"
          ROOT_LOOPDEV=""

          # ========================================================
          # Tarball Größen
          # ========================================================

          BOOT_SIZE="$(stat -c%s boot.tar.xz)"
          ROOT_SIZE="$(stat -c%s root.tar.xz)"

          DOWNLOAD_SIZE=$((BOOT_SIZE + ROOT_SIZE))

          # ========================================================
          # PINN Größen
          # ========================================================

          BOOT_NOMINAL=$((BOOT_UNCOMPRESSED_MIB + 100))
          ROOT_NOMINAL=$((ROOT_UNCOMPRESSED_MIB + 400))

          NOMINAL_SIZE=$((BOOT_NOMINAL + ROOT_NOMINAL))

          # ========================================================
          # SHA256
          # ========================================================

          BOOT_SHA256="$(
            sha256sum boot.tar.xz |
            awk '{print $1}'
          )"

          ROOT_SHA256="$(
            sha256sum root.tar.xz |
            awk '{print $1}'
          )"

          # ========================================================
          # SHA256SUMS
          # ========================================================

          sha256sum \
            boot.tar.xz \
            root.tar.xz \
            > SHA256SUMS

          # ========================================================
          # GitHub Environment
          # ========================================================

          {
            echo "BOOT_PARTITION_SIZE=$BOOT_PARTITION_MIB"
            echo "ROOT_PARTITION_SIZE=$ROOT_PARTITION_MIB"

            echo "BOOT_UNCOMPRESSED=$BOOT_UNCOMPRESSED_MIB"
            echo "ROOT_UNCOMPRESSED=$ROOT_UNCOMPRESSED_MIB"

            echo "BOOT_NOMINAL=$BOOT_NOMINAL"
            echo "ROOT_NOMINAL=$ROOT_NOMINAL"

            echo "BOOT_SIZE=$BOOT_SIZE"
            echo "ROOT_SIZE=$ROOT_SIZE"

            echo "DOWNLOAD_SIZE=$DOWNLOAD_SIZE"
            echo "NOMINAL_SIZE=$NOMINAL_SIZE"

            echo "BOOT_SHA256=$BOOT_SHA256"
            echo "ROOT_SHA256=$ROOT_SHA256"
          } >> "$GITHUB_ENV"

          # ========================================================
          # Ausgabe
          # ========================================================

          echo
          echo "=========================================="
          echo "       DRAGONOS → PINN BUILD"
          echo "=========================================="

          echo
          echo "BOOT:"
          echo "  Partition:       ${BOOT_PARTITION_MIB} MiB"
          echo "  Daten:           ${BOOT_UNCOMPRESSED_MIB} MiB"
          echo "  Nominal:         ${BOOT_NOMINAL} MiB"
          echo "  Tarball:         ${BOOT_SIZE} Bytes"
          echo "  SHA256:          ${BOOT_SHA256}"

          echo
          echo "ROOT:"
          echo "  Partition:       ${ROOT_PARTITION_MIB} MiB"
          echo "  Daten:           ${ROOT_UNCOMPRESSED_MIB} MiB"
          echo "  Nominal:         ${ROOT_NOMINAL} MiB"
          echo "  Tarball:         ${ROOT_SIZE} Bytes"
          echo "  SHA256:          ${ROOT_SHA256}"

          echo
          echo "PINN:"
          echo "  Nominal Size:    ${NOMINAL_SIZE} MiB"
          echo "  Download Size:   ${DOWNLOAD_SIZE} Bytes"

          echo
          echo "=========================================="
          echo "SHA256SUMS"
          echo "=========================================="

          cat SHA256SUMS

      # ============================================================
      # PINN Metadaten
      # ============================================================

      - name: 📝 PINN Metadaten erzeugen
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p pinn

          cat > pinn/partitions.json <<EOF
          {
            "partitions": [
              {
                "label": "boot",
                "filesystem_type": "fat",
                "partition_size_nominal": ${BOOT_NOMINAL},
                "want_maximised": false,
                "uncompressed_tarball_size": ${BOOT_UNCOMPRESSED},
                "requiresPartitionNumber": 1
              },
              {
                "label": "root",
                "filesystem_type": "ext4",
                "partition_size_nominal": ${ROOT_NOMINAL},
                "want_maximised": true,
                "uncompressed_tarball_size": ${ROOT_UNCOMPRESSED},
                "requiresPartitionNumber": 2
              }
            ]
          }
          EOF

          cat > pinn/os.json <<EOF
          {
            "name": "DragonOS Pi64 Beta42",
            "description": "DragonOS Pi64 Beta42 for Raspberry Pi",
            "supported_models": [
              "Pi 3",
              "Pi 4",
              "Pi 5",
              "Compute Module 3",
              "Compute Module 4",
              "Compute Module 5"
            ],
            "release_date": "2026-10-05",
            "version": "Beta42",
            "group": "General",
            "supports_backup": false,
            "download_size": ${DOWNLOAD_SIZE},
            "nominal_size": ${NOMINAL_SIZE}
          }
          EOF

          echo
          echo "===== partitions.json ====="
          cat pinn/partitions.json

          echo
          echo "===== os.json ====="
          cat pinn/os.json

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: 🚀 GitHub Release erstellen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG existiert bereits."
          else
            echo "Erstelle Release $RELEASE_TAG ..."

            gh release create "$RELEASE_TAG" \
              --title "DragonOS Pi64 Beta42 for PINN" \
              --notes "DragonOS Pi64 Beta42 PINN release."
          fi

      # ============================================================
      # Release Assets
      # ============================================================

      - name: 📤 PINN Dateien zum GitHub Release hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            boot.tar.xz \
            root.tar.xz \
            SHA256SUMS \
            --clobber

      # ============================================================
      # Workflow Artefakte
      # ============================================================

      - name: 📦 Build-Artefakte speichern
        uses: actions/upload-artifact@v4
        with:
          name: DragonOS-Pi64-Beta42-PINN
          retention-days: 7
          path: |
            boot.tar.xz
            root.tar.xz
            SHA256SUMS
            pinn/os.json
            pinn/partitions.json

      # ============================================================
      # Summary
      # ============================================================

      - name: 📋 Build-Zusammenfassung
        shell: bash
        run: |
          {
            echo "## 🐉 DragonOS Pi64 Beta42 → PINN"
            echo
            echo "| Datei | Größe |"
            echo "|---|---:|"
            echo "| boot.tar.xz | ${BOOT_SIZE} Bytes |"
            echo "| root.tar.xz | ${ROOT_SIZE} Bytes |"
            echo
            echo "**PINN nominal size:** ${NOMINAL_SIZE} MiB"
            echo
            echo "**Download size:** ${DOWNLOAD_SIZE} Bytes"
            echo
            echo "**Release:** ${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"