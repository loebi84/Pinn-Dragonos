name:🐉BuildDragonOSPi64forPINN
on:
workflow_dispatch:
schedule:
-cron:"03**1"
permissions:
contents:write
env:
DRAGONOS_URL:"https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz/download"
IMAGE_GZ:"DragonOS_Pi64_Beta42.img.gz"
IMAGE:"DragonOS_Pi64_Beta42.img"
#SourceForge
SF_HOST:"frs.sourceforge.net"
SF_PROJECT:"dragonos-pi64"
SF_RELEASE:"PINN"
jobs:
build-pinn:
runs-on:ubuntu-latest
steps:
#----------------------------------------------------------
#1.Repository
#----------------------------------------------------------
-name:📥Repositoryklonen
uses:actions/checkout@v4
#----------------------------------------------------------
#2.Tools
#----------------------------------------------------------
-name:🔧Toolsinstallieren
run:|
sudoapt-getupdate
sudoapt-getinstall-y\
wget\
xz-utils\
parted\
util-linux\
e2fsprogs\
dosfstools\
rsync\
jq
#----------------------------------------------------------
#3.DragonOSBeta42herunterladen
#----------------------------------------------------------
-name:📥DragonOSBeta42herunterladen
run:|
echo"🐉LadeDragonOSPi64Beta42..."
wget\
--progress=dot:giga\
-O"$IMAGE_GZ"\
"$DRAGONOS_URL"
echo
echo"Download:"
ls-lh"$IMAGE_GZ"
#----------------------------------------------------------
#4.Imageentpacken
#----------------------------------------------------------
-name:📦Imageentpacken
run:|
echo"📦EntpackeImage..."
gzip-dc"$IMAGE_GZ">"$IMAGE"
echo
echo"Image:"
ls-lh"$IMAGE"
#----------------------------------------------------------
#5.Partitionstabelleprüfen
#----------------------------------------------------------
-name:🔍Partitionenanalysieren
run:|
echo"=====fdisk====="
sudofdisk-l"$IMAGE"
echo
echo"=====parted====="
sudoparted"$IMAGE"unitsprint
#----------------------------------------------------------
#6.Tarballserzeugen
#----------------------------------------------------------
-name:🔧PINNTarballserzeugen
shell:bash
run:|
set-euopipefail
WORK="$PWD/work"
BOOT="$WORK/boot"
ROOT="$WORK/root"
mkdir-p"$BOOT""$ROOT"
#Partition1=FAT32boot
#Partition2=ext4root
BOOT_START=$(sudofdisk-l"$IMAGE"|awk'$1~/img1$/{print$2}')
BOOT_END=$(sudofdisk-l"$IMAGE"|awk'$1~/img1$/{print$3}')
ROOT_START=$(sudofdisk-l"$IMAGE"|awk'$1~/img2$/{print$2}')
ROOT_END=$(sudofdisk-l"$IMAGE"|awk'$1~/img2$/{print$3}')
if[[-z"$BOOT_START"||-z"$ROOT_START"]];then
echo"❌Boot-oderRoot-Partitionnichtgefunden."
exit1
fi
SECTOR_SIZE=512
BOOT_OFFSET=$((BOOT_START*SECTOR_SIZE))
ROOT_OFFSET=$((ROOT_START*SECTOR_SIZE))
echo"Boot:"
echo"Start:$BOOT_START"
echo"Ende:$BOOT_END"
echo"Offset:$BOOT_OFFSET"
echo
echo"Root:"
echo"Start:$ROOT_START"
echo"Ende:$ROOT_END"
echo"Offset:$ROOT_OFFSET"
#------------------------------------------------------
#Bootmounten
#------------------------------------------------------
echo
echo"==>Mountboot"
sudomount\
-oloop,ro,offset="$BOOT_OFFSET"\
"$IMAGE"\
"$BOOT"
#------------------------------------------------------
#Rootmounten
#------------------------------------------------------
echo"==>Mountroot"
sudomount\
-oloop,ro,offset="$ROOT_OFFSET"\
"$IMAGE"\
"$ROOT"
#------------------------------------------------------
#BootTarball
#------------------------------------------------------
echo
echo"==>Erzeugeboot.tar.xz"
sudotar\
--xattrs\
--acls\
--numeric-owner\
--one-file-system\
-C"$BOOT"\
-cJfboot.tar.xz.
#------------------------------------------------------
#RootTarball
#------------------------------------------------------
echo"==>Erzeugeroot.tar.xz"
sudotar\
--xattrs\
--acls\
--numeric-owner\
--one-file-system\
--exclude="./lost+found"\
-C"$ROOT"\
-cJfroot.tar.xz.
#------------------------------------------------------
#Größen
#------------------------------------------------------
BOOT_UNCOMPRESSED=$(sudodu-sm"$BOOT"|awk'{print$1}')
ROOT_UNCOMPRESSED=$(sudodu-sm"$ROOT"|awk'{print$1}')
BOOT_PARTITION_SIZE=$((\
(BOOT_END-BOOT_START+1)\
*SECTOR_SIZE/1024/1024\
))
ROOT_PARTITION_SIZE=$((\
(ROOT_END-ROOT_START+1)\
*SECTOR_SIZE/1024/1024\
))
BOOT_NOMINAL=$((BOOT_UNCOMPRESSED+100))
ROOT_NOMINAL=$((ROOT_UNCOMPRESSED+400))
BOOT_SHA512=$(sha512sumboot.tar.xz|awk'{print$1}')
ROOT_SHA512=$(sha512sumroot.tar.xz|awk'{print$1}')
BOOT_SIZE=$(stat-c%sboot.tar.xz)
ROOT_SIZE=$(stat-c%sroot.tar.xz)
DOWNLOAD_SIZE=$((BOOT_SIZE+ROOT_SIZE))
NOMINAL_SIZE=$((BOOT_NOMINAL+ROOT_NOMINAL))
echo
echo"=====Größen====="
echo"BootPartition:${BOOT_PARTITION_SIZE}MiB"
echo"BootDaten:${BOOT_UNCOMPRESSED}MiB"
echo"RootPartition:${ROOT_PARTITION_SIZE}MiB"
echo"RootDaten:${ROOT_UNCOMPRESSED}MiB"
echo"BootTarball:${BOOT_SIZE}bytes"
echo"RootTarball:${ROOT_SIZE}bytes"
#------------------------------------------------------
#Unmount
#------------------------------------------------------
sudoumount"$BOOT"
sudoumount"$ROOT"
#------------------------------------------------------
#Werteexportieren
#------------------------------------------------------
{
echo"BOOT_NOMINAL=$BOOT_NOMINAL"
echo"ROOT_NOMINAL=$ROOT_NOMINAL"
echo"BOOT_UNCOMPRESSED=$BOOT_UNCOMPRESSED"
echo"ROOT_UNCOMPRESSED=$ROOT_UNCOMPRESSED"
echo"BOOT_PARTITION_SIZE=$BOOT_PARTITION_SIZE"
echo"ROOT_PARTITION_SIZE=$ROOT_PARTITION_SIZE"
echo"BOOT_SHA512=$BOOT_SHA512"
echo"ROOT_SHA512=$ROOT_SHA512"
echo"BOOT_SIZE=$BOOT_SIZE"
echo"ROOT_SIZE=$ROOT_SIZE"
echo"DOWNLOAD_SIZE=$DOWNLOAD_SIZE"
echo"NOMINAL_SIZE=$NOMINAL_SIZE"
}>>"$GITHUB_ENV"
#----------------------------------------------------------
#7.Tarballstesten
#----------------------------------------------------------
-name:🧪Tarballsprüfen
run:|
set-e
echo"Testeboot.tar.xz..."
xz-tboot.tar.xz
tar-tJfboot.tar.xz>/dev/null
echo"Testeroot.tar.xz..."
xz-troot.tar.xz
tar-tJfroot.tar.xz>/dev/null
echo"✅BeideTarballssindgültig."
#----------------------------------------------------------
#8.PINNpartitions.json
#----------------------------------------------------------
-name:📝partitions.jsonerzeugen
run:|
mkdir-p\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos
cat>\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json\
<<EOF
{
"partitions":[
{
"label":"dragon_boot",
"filesystem_type":"fat",
"partition_size_nominal":${BOOT_NOMINAL},
"want_maximised":false,
"uncompressed_tarball_size":${BOOT_UNCOMPRESSED},
"partition_type":"0xC",
"active":true,
"mkfs_options":"-F32",
"sha512sum":"${BOOT_SHA512}"
},
{
"label":"dragon_root",
"filesystem_type":"ext4",
"partition_size_nominal":${ROOT_NOMINAL},
"want_maximised":true,
"uncompressed_tarball_size":${ROOT_UNCOMPRESSED},
"sha512sum":"${ROOT_SHA512}"
}
]
}
EOF
cat\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json
#----------------------------------------------------------
#9.os.json
#----------------------------------------------------------
-name:📝os.jsonerzeugen
run:|
cat>\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/os.json\
<<'EOF'
{
"name":"dragonos-pi64",
"description":"DragonOSPi64–SDRDistribution",
"url":"https://sourceforge.net/projects/dragonos-pi64/",
"version":"Beta42",
"release_date":"2025-10-06",
"supported_models":[
"Pi4",
"Pi400",
"ComputeModule4"
],
"username":"dragon",
"password":"dragon",
"supports_backup":true,
"bootable":true,
"partition_setup":"partition_setup.sh",
"postinstall_script":"postinstall.sh"
}
EOF
#----------------------------------------------------------
#10.SourceForgeUpload
#----------------------------------------------------------
-name:🚀TarballszuSourceForgehochladen
env:
SF_USERNAME:${{secrets.SF_USERNAME}}
SF_SSH_KEY:${{secrets.SF_SSH_KEY}}
run:|
set-euopipefail
if[[-z"${SF_USERNAME:-}"]];then
echo"❌SecretSF_USERNAMEfehlt."
exit1
fi
if[[-z"${SF_SSH_KEY:-}"]];then
echo"❌SecretSF_SSH_KEYfehlt."
exit1
fi
mkdir-p~/.ssh
printf'%s\n'"$SF_SSH_KEY">~/.ssh/sourceforge_key
chmod600~/.ssh/sourceforge_key
ssh-keyscan-H"$SF_HOST">>~/.ssh/known_hosts
echo"🚀Uploadboot.tar.xz..."
rsync\
-avP\
-e"ssh-i~/.ssh/sourceforge_key-oStrictHostKeyChecking=yes"\
boot.tar.xz\
"${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_RELEASE}/"
echo"🚀Uploadroot.tar.xz..."
rsync\
-avP\
-e"ssh-i~/.ssh/sourceforge_key-oStrictHostKeyChecking=yes"\
root.tar.xz\
"${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_RELEASE}/"
echo"✅SourceForgeUploadabgeschlossen."
#----------------------------------------------------------
#11.os_list_v3.json
#----------------------------------------------------------
-name:📝os_list_v3.jsonerzeugen
run:|
mkdir-pPINN_DragonOS_Repo_unzipped
cat>PINN_DragonOS_Repo_unzipped/os_list_v3.json<<EOF
{
"os_list":[
{
"description":"DragonOSPi64–SDRDistribution",
"download_size":${DOWNLOAD_SIZE},
"group":"Raspbian",
"icon":"https://loebi84.github.io/Pinn-Dragonos/dragonos/icon.png",
"nominal_size":${NOMINAL_SIZE},
"os_info":"https://loebi84.github.io/Pinn-Dragonos/dragonos/os.json",
"os_name":"dragonos-pi64",
"partition_setup":"https://loebi84.github.io/Pinn-Dragonos/dragonos/partition_setup.sh",
"partitions_info":"https://loebi84.github.io/Pinn-Dragonos/dragonos/partitions.json",
"release_date":"2025-10-06",
"supported_models":[
"Pi4",
"Pi400",
"ComputeModule4"
],
"supports_backup":true,
"tarballs":[
"https://sourceforge.net/projects/${SF_PROJECT}/files/${SF_RELEASE}/boot.tar.xz/download",
"https://sourceforge.net/projects/${SF_PROJECT}/files/${SF_RELEASE}/root.tar.xz/download"
],
"version":"Beta42"
}
]
}
EOF
catPINN_DragonOS_Repo_unzipped/os_list_v3.json
#----------------------------------------------------------
#12.JSONvalidieren
#----------------------------------------------------------
-name:🧪JSONvalidieren
run:|
jqempty\
PINN_DragonOS_Repo_unzipped/os_list_v3.json
jqempty\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/os.json
jqempty\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json
echo"✅AlleJSON-Dateiensindgültig."
#----------------------------------------------------------
#13.PINNMetadatencommitten
#----------------------------------------------------------
-name:⬆️PINNMetadatencommitten
run:|
gitconfiguser.name"LöbiBot"
gitconfiguser.email"bot@dragonos.local"
gitadd\
PINN_DragonOS_Repo_unzipped/os_list_v3.json\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/os.json\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json
ifgitdiff--cached--quiet;then
echo"KeineÄnderungen."
else
gitcommit\
-m"🐉UpdateDragonOSPi64Beta42PINNmetadata"
gitpush
fi
#----------------------------------------------------------
#14.Aufräumen
#----------------------------------------------------------
-name:🧹Aufräumen
if:always()
run:|
sudoumount"$PWD/work/boot"2>/dev/null||true
sudoumount"$PWD/work/root"2>/dev/null||true
rm-f"$IMAGE_GZ"
rm-f"$IMAGE"
rm-f~/.ssh/sourceforge_key

###EinmaliginGitHubeinrichten

Dubrauchstunter:

Repository→Settings→Secretsandvariables→Actions

zweiSecrets:

SF_USERNAME

=deinSourceForge-Benutzername

und

SF_SSH_KEY

=derprivateSSH-Key,dessenöffentlicherSchlüsselbeiSourceForgehinterlegtist.

SourceForgeunterstütztgenaudiesenSSH/rsync-WegundempfiehltrsyncinsbesonderefürDateienüber100MB,weilabgebrocheneTransfersfortgesetztwerdenkönnen.

DeinSourceForge-Projektpfadistdabei:

/home/frs/project/dragonos-pi64/PINN/

DieActionerzeugtdamit:

SourceForge
└──PINN
├──boot.tar.xz
└──root.tar.xz

undPINNbekommtanschließenddirekteDownload-URLswie:

https://sourceforge.net/projects/dragonos-pi64/files/PINN/boot.tar.xz/download
https://sourceforge.net/projects/dragonos-pi64/files/PINN/root.tar.xz/download

DasistfürdeinVorhabenwesentlichsinnvolleralsGitHubReleases,weilSourceForgefürgroßeRelease-Dateienausgelegtist;einzelneDateiendürfendortbis10GBgroßsein.

**EineSachewürdeichvordemerstenLaufnochprüfen:**DeinSourceForge-Projektheißttatsächlichdragonos-pi64–derDownload-Link,dendumirgegebenhast,verwendetgenaudiesenProjektnamen.Daspasstalso.

WenndudieYAMLsoeinsetzt,bittenochnichtwundern,wennderersteLaufmehrereMinutenbisdeutlichlängerdauert:Das5-GB-Imagemussgeladen,entpackt,gemountet,zweimalmitXZkomprimiertundanschließendperrsynchochgeladenwerden.