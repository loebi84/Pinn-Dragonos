name: Build DragonOS Pi64 for PINN

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  REPO: loebi84/Pinn-Dragonos

  DRAGONOS_VERSION: Beta42

  SOURCE_URL: https://downloads.sourceforge.net/project/dragonos-pi64/DragonOS_Pi64_Beta42.img.gz
  SOURCE_SHA_URL: https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz.SHA256.txt/download

  IMAGE_GZ: DragonOS_Pi64_Beta42.img.gz
  IMAGE: DragonOS_Pi64_Beta42.img

  RELEASE_TAG: dragonos-pi64-beta42

  SPLIT_SIZE: 1900M

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

        sudo apt-get install -y \
        curl \
        parted \
        xz-utils \
        gzip \
        jq \
        util-linux \
        pv

      # ------------------------------------------------------------
      # GitHub CLI
      # ------------------------------------------------------------

      - name: Check GitHub CLI
        run: |
          set -euo pipefail

          gh --version

      # ------------------------------------------------------------
      # Create release if it does not exist
      # ------------------------------------------------------------

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists."
          else
            echo "Creating release $RELEASE_TAG..."

            gh release create "$RELEASE_TAG" \
              --repo "$REPO" \
              --title "DragonOS Pi64 Beta42 for PINN" \
              --notes "DragonOS Pi64 Beta42 PINN distribution assets."
          fi

      # ------------------------------------------------------------
      # Check whether original image parts already exist
      # ------------------------------------------------------------

      - name: Check stored DragonOS image parts
        id: release_assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Prüfe Release-Assets..."

          ASSETS="$(gh release view "$RELEASE_TAG" \
            --repo "$REPO" \
            --json assets \
            --jq '.assets[].name' || true)"

          echo "$ASSETS"

          READY=true

          for PART in \
            "DragonOS_Pi64_Beta42.img.gz.part-aa" \
            "DragonOS_Pi64_Beta42.img.gz.part-ab" \
            "DragonOS_Pi64_Beta42.img.gz.part-ac"
          do
            if ! echo "$ASSETS" | grep -Fxq "$PART"; then
              echo "Fehlt: $PART"
              READY=false
            fi
          done

          if [ "$READY" = true ]; then
            echo "Alle Image-Parts vorhanden."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image-Parts fehlen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # Download original SourceForge image
      # Only needed for first/repair run
      # ------------------------------------------------------------

      - name: Download original DragonOS image
        if: steps.release_assets.outputs.ready != 'true'
        run: |
          set -euo pipefail

          echo "Lade Original-Image von SourceForge..."

          rm -f "$IMAGE_GZ"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --progress-bar \
            -o "$IMAGE_GZ" \
            "$SOURCE_URL"

          echo
          echo "Download abgeschlossen:"
          ls -lh "$IMAGE_GZ"

      # ------------------------------------------------------------
      # Download official SHA256
      # ------------------------------------------------------------

      - name: Download official DragonOS SHA256
        if: steps.release_assets.outputs.ready != 'true'
        run: |
          set -euo pipefail

          echo "Lade offizielle SHA256-Prüfsumme..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --silent \
            --show-error \
            -o official.sha256.txt \
            "$SOURCE_SHA_URL"

          echo "Offizielle SHA256-Datei:"
          cat official.sha256.txt

      # ------------------------------------------------------------
      # Verify original image
      # ------------------------------------------------------------

      - name: Verify original DragonOS image
        if: steps.release_assets.outputs.ready != 'true'
        run: |
          set -euo pipefail

          echo "Prüfe SHA256..."

          EXPECTED_SHA="$(
            awk -v file="$IMAGE_GZ" '
              {
                name=$2
                sub(/^\*/, "", name)

                if (name == file) {
                  print $1
                  exit
                }
              }
            ' official.sha256.txt
          )"

          if [ -z "$EXPECTED_SHA" ]; then
            EXPECTED_SHA="$(
              awk '
                /^[0-9a-fA-F]{64}[[:space:]]/ {
                  print $1
                  exit
                }
              ' official.sha256.txt
            )"
          fi

          if [ -z "$EXPECTED_SHA" ]; then
            echo "FEHLER: Konnte offizielle SHA256 nicht auslesen."
            exit 1
          fi

          ACTUAL_SHA="$(sha256sum "$IMAGE_GZ" | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA"
          echo "Actual:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "FEHLER: SHA256 stimmt nicht überein!"
            exit 1
          fi

          echo "SHA256 OK."

          printf '%s  %s\n' "$EXPECTED_SHA" "$IMAGE_GZ" \
            > DragonOS_Pi64_Beta42.img.gz.SHA256SUMS

      # ------------------------------------------------------------
      # Split original image
      # ------------------------------------------------------------

      - name: Split original DragonOS image
        if: steps.release_assets.outputs.ready != 'true'
        run: |
          set -euo pipefail

          echo "Teile Image in Release-kompatible Dateien..."

          rm -f DragonOS_Pi64_Beta42.img.gz.part-*

          split \
            --bytes="$SPLIT_SIZE" \
            --numeric-suffixes=0 \
            --suffix-length=2 \
            "$IMAGE_GZ" \
            DragonOS_Pi64_Beta42.img.gz.part-

          mv \
            DragonOS_Pi64_Beta42.img.gz.part-00 \
            DragonOS_Pi64_Beta42.img.gz.part-aa

          mv \
            DragonOS_Pi64_Beta42.img.gz.part-01 \
            DragonOS_Pi64_Beta42.img.gz.part-ab

          mv \
            DragonOS_Pi64_Beta42.img.gz.part-02 \
            DragonOS_Pi64_Beta42.img.gz.part-ac

          echo
          echo "Erzeugte Parts:"

          ls -lh \
            DragonOS_Pi64_Beta42.img.gz.part-aa \
            DragonOS_Pi64_Beta42.img.gz.part-ab \
            DragonOS_Pi64_Beta42.img.gz.part-ac

      # ------------------------------------------------------------
      # Upload original image parts to GitHub Release
      # ------------------------------------------------------------

      - name: Store DragonOS image in GitHub Release
        if: steps.release_assets.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Lade Image-Parts in GitHub Release..."

          gh release upload "$RELEASE_TAG" \
            --repo "$REPO" \
            --clobber \
            DragonOS_Pi64_Beta42.img.gz.part-aa \
            DragonOS_Pi64_Beta42.img.gz.part-ab \
            DragonOS_Pi64_Beta42.img.gz.part-ac \
            DragonOS_Pi64_Beta42.img.gz.SHA256SUMS

          echo "Image dauerhaft im Release gespeichert."

      # ------------------------------------------------------------
      # Download stored parts for later runs
      # ------------------------------------------------------------

      - name: Download stored DragonOS image parts
        if: steps.release_assets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Lade gespeicherte Image-Parts aus GitHub Release..."

          gh release download "$RELEASE_TAG" \
            --repo "$REPO" \
            --pattern "DragonOS_Pi64_Beta42.img.gz.part-aa" \
            --pattern "DragonOS_Pi64_Beta42.img.gz.part-ab" \
            --pattern "DragonOS_Pi64_Beta42.img.gz.part-ac" \
            --clobber

          echo "Image-Parts heruntergeladen."

      # ------------------------------------------------------------
      # Download checksum from release on later runs
      # ------------------------------------------------------------

      - name: Download stored original checksum
        if: steps.release_assets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release download "$RELEASE_TAG" \
            --repo "$REPO" \
            --pattern "DragonOS_Pi64_Beta42.img.gz.SHA256SUMS" \
            --clobber

      # ------------------------------------------------------------
      # Reconstruct compressed image
      # ------------------------------------------------------------

      - name: Reconstruct DragonOS compressed image
        if: steps.release_assets.outputs.ready == 'true'
        run: |
          set -euo pipefail

          echo "Rekonstruiere DragonOS .img.gz..."

          cat \
            DragonOS_Pi64_Beta42.img.gz.part-aa \
            DragonOS_Pi64_Beta42.img.gz.part-ab \
            DragonOS_Pi64_Beta42.img.gz.part-ac \
            > "$IMAGE_GZ"

          echo
          echo "Rekonstruierte Datei:"
          ls -lh "$IMAGE_GZ"

          echo
          echo "Prüfe SHA256 der rekonstruierten Datei..."

          sha256sum -c DragonOS_Pi64_Beta42.img.gz.SHA256SUMS

          echo "SHA256 OK."

      # ------------------------------------------------------------
      # Reconstruct directly from local image on first run
      # ------------------------------------------------------------

      - name: Prepare local image for first run
        if: steps.release_assets.outputs.ready != 'true'
        run: |
          set -euo pipefail

          echo "Erster Lauf: lokale Originaldatei wird verwendet."

          test -f "$IMAGE_GZ"
          test -f DragonOS_Pi64_Beta42.img.gz.SHA256SUMS

          sha256sum -c DragonOS_Pi64_Beta42.img.gz.SHA256SUMS

      # ------------------------------------------------------------
      # Decompress DragonOS image
      # ------------------------------------------------------------

      - name: Decompress DragonOS image
        run: |
          set -euo pipefail

          echo "Entpacke DragonOS Image..."

          rm -f "$IMAGE"

          gzip -dc "$IMAGE_GZ" | \
            dd \
              of="$IMAGE" \
              bs=4M \
              iflag=fullblock \
              conv=sparse

          sync

          echo
          echo "Image erfolgreich rekonstruiert:"

          ls -lh "$IMAGE"

          echo
          echo "Tatsächlich belegter Speicher:"

          du -h "$IMAGE"

          echo
          echo "Runner-Speicher:"

          df -h .

      # ------------------------------------------------------------
      # Remove compressed image to free disk space
      # ------------------------------------------------------------

      - name: Remove compressed image
        run: |
          set -euo pipefail

          rm -f "$IMAGE_GZ"

          rm -f \
            DragonOS_Pi64_Beta42.img.gz.part-aa \
            DragonOS_Pi64_Beta42.img.gz.part-ab \
            DragonOS_Pi64_Beta42.img.gz.part-ac

          rm -f official.sha256.txt

          echo "Komprimierte Quelldaten entfernt."

          df -h .

      # ------------------------------------------------------------
      # Inspect partition table
      # ------------------------------------------------------------

      - name: Inspect DragonOS partition table
        run: |
          set -euo pipefail

          echo "Partitionstabelle:"

          sudo parted "$IMAGE" unit s print

      # ------------------------------------------------------------
      # Prepare PINN extraction
      # ------------------------------------------------------------

      - name: Prepare PINN filesystems
        run: |
          set -euo pipefail

          mkdir -p work/boot
          mkdir -p work/root
          mkdir -p pinn

          SECTOR_SIZE=512

          LOOPDEV="$(sudo losetup --find --show --read-only "$IMAGE")"

          cleanup() {
            set +e

            if mountpoint -q work/boot; then
              sudo umount work/boot
            fi

            if mountpoint -q work/root; then
              sudo umount work/root
            fi

            if [ -n "${BOOT_LOOPDEV:-}" ]; then
              sudo losetup -d "$BOOT_LOOPDEV" 2>/dev/null || true
            fi

            if [ -n "${ROOT_LOOPDEV:-}" ]; then
              sudo losetup -d "$ROOT_LOOPDEV" 2>/dev/null || true
            fi

            if [ -n "${LOOPDEV:-}" ]; then
              sudo losetup -d "$LOOPDEV" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          echo
          echo "Loop device:"
          echo "$LOOPDEV"

          echo
          echo "Partitionen:"

          sudo parted -ms "$IMAGE" unit s print

          PART1="$(
            sudo parted -ms "$IMAGE" unit s print |
            awk -F: '$1 == "1" { print; exit }'
          )"

          PART2="$(
            sudo parted -ms "$IMAGE" unit s print |
            awk -F: '$1 == "2" { print; exit }'
          )"

          if [ -z "$PART1" ] || [ -z "$PART2" ]; then
            echo "FEHLER: Partition 1 oder 2 nicht gefunden."
            exit 1
          fi

          echo
          echo "PART1:"
          echo "$PART1"

          echo
          echo "PART2:"
          echo "$PART2"

          PART1_START="$(echo "$PART1" | cut -d: -f2 | tr -d s)"
          PART1_END="$(echo "$PART1" | cut -d: -f3 | tr -d s)"
          PART1_FS="$(echo "$PART1" | cut -d: -f5)"

          PART2_START="$(echo "$PART2" | cut -d: -f2 | tr -d s)"
          PART2_END="$(echo "$PART2" | cut -d: -f3 | tr -d s)"
          PART2_FS="$(echo "$PART2" | cut -d: -f5)"

          echo
          echo "Partition 1:"
          echo "  Start: $PART1_START"
          echo "  End:   $PART1_END"
          echo "  FS:    $PART1_FS"

          echo
          echo "Partition 2:"
          echo "  Start: $PART2_START"
          echo "  End:   $PART2_END"
          echo "  FS:    $PART2_FS"

          if [ "$PART1_FS" != "fat32" ]; then
            echo "FEHLER: Partition 1 ist nicht FAT32."
            exit 1
          fi

          if [ "$PART2_FS" != "ext4" ]; then
            echo "FEHLER: Partition 2 ist nicht ext4."
            exit 1
          fi

          BOOT_SECTORS=$((PART1_END - PART1_START + 1))
          ROOT_SECTORS=$((PART2_END - PART2_START + 1))

          BOOT_PARTITION_BYTES=$((BOOT_SECTORS * SECTOR_SIZE))
          ROOT_PARTITION_BYTES=$((ROOT_SECTORS * SECTOR_SIZE))

          BOOT_OFFSET=$((PART1_START * SECTOR_SIZE))
          ROOT_OFFSET=$((PART2_START * SECTOR_SIZE))

          BOOT_PARTITION_MIB=$((BOOT_PARTITION_BYTES / 1024 / 1024))
          ROOT_PARTITION_MIB=$((ROOT_PARTITION_BYTES / 1024 / 1024))

          echo
          echo "Berechnete Partitionen:"
          echo "  Boot offset: $BOOT_OFFSET"
          echo "  Boot size:   $BOOT_PARTITION_BYTES bytes"
          echo "  Boot size:   $BOOT_PARTITION_MIB MiB"

          echo "  Root offset: $ROOT_OFFSET"
          echo "  Root size:   $ROOT_PARTITION_BYTES bytes"
          echo "  Root size:   $ROOT_PARTITION_MIB MiB"

          # --------------------------------------------------------
          # IMPORTANT:
          # Do NOT use mount -o loop here.
          # We already have the full image on LOOPDEV.
          # Separate offset loop devices are created instead.
          # --------------------------------------------------------

          BOOT_LOOPDEV="$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              --offset "$BOOT_OFFSET" \
              --sizelimit "$BOOT_PARTITION_BYTES" \
              "$IMAGE"
          )"

          ROOT_LOOPDEV="$(
            sudo losetup \
              --find \
              --show \
              --read-only \
              --offset "$ROOT_OFFSET" \
              --sizelimit "$ROOT_PARTITION_BYTES" \
              "$IMAGE"
          )"

          echo
          echo "Boot loop device:"
          echo "$BOOT_LOOPDEV"

          echo "Root loop device:"
          echo "$ROOT_LOOPDEV"

          echo
          echo "Mounting boot..."

          sudo mount \
            -o ro \
            "$BOOT_LOOPDEV" \
            work/boot

          echo "Mounting root..."

          sudo mount \
            -o ro \
            "$ROOT_LOOPDEV" \
            work/root

          echo
          echo "Boot Inhalt:"
          sudo ls -lah work/boot | head -50

          echo
          echo "Root Inhalt:"
          sudo ls -lah work/root | head -50

          # --------------------------------------------------------
          # Create PINN tarballs
          # --------------------------------------------------------

          echo
          echo "Erzeuge boot.tar.xz..."

          sudo tar \
         --numeric-owner \
         --xattrs \
         --acls \
         --sparse \
         -C work/boot \
         -cf - \
         . | \
         pv \
         --rate \
         --timer \
         --eta \
         --bytes | \
         xz \
         -T0 \
         -3 \
         > boot.tar.xz

          echo
          echo "Erzeuge root.tar.xz..."

         sudo tar \
         --numeric-owner \
         --xattrs \
         --acls \
         --sparse \
         -C work/root \
         -cf - \
         . | \
         pv \
         --rate \
         --timer \
         --eta \
         --bytes | \
         xz \
         -T0 \
         -3 \
         > root.tar.xz

          echo
          echo "Tarballs erzeugt:"

          ls -lh \
            boot.tar.xz \
            root.tar.xz

          # --------------------------------------------------------
          # PINN partition metadata
          # --------------------------------------------------------

          BOOT_RAW_BYTES="$(
            sudo du -sb work/boot |
            awk '{print $1}'
          )"

          ROOT_RAW_BYTES="$(
            sudo du -sb work/root |
            awk '{print $1}'
          )"

          BOOT_UNCOMPRESSED_MIB=$(((BOOT_RAW_BYTES + 1048575) / 1048576))
          ROOT_UNCOMPRESSED_MIB=$(((ROOT_RAW_BYTES + 1048575) / 1048576))

          DOWNLOAD_SIZE=$((BOOT_UNCOMPRESSED_MIB + ROOT_UNCOMPRESSED_MIB))

          BOOT_NOMINAL=$((BOOT_UNCOMPRESSED_MIB + 100))
          ROOT_NOMINAL=$((ROOT_UNCOMPRESSED_MIB + 400))

          NOMINAL_SIZE=$((BOOT_NOMINAL + ROOT_NOMINAL))

          # --------------------------------------------------------
          # Write partition metadata
          # --------------------------------------------------------

          cat > pinn/partitions.json <<EOF
          {
            "partition_setup": "mbr",
            "partitions": [
              {
                "partition": 1,
                "filesystem": "fat32",
                "label": "boot",
                "tarball": "boot.tar.xz",
                "uncompressed": ${BOOT_UNCOMPRESSED_MIB},
                "nominal_size": ${BOOT_NOMINAL}
              },
              {
                "partition": 2,
                "filesystem": "ext4",
                "label": "root",
                "tarball": "root.tar.xz",
                "uncompressed": ${ROOT_UNCOMPRESSED_MIB},
                "nominal_size": ${ROOT_NOMINAL}
              }
            ]
          }
          EOF

          # --------------------------------------------------------
          # Basic OS metadata
          # --------------------------------------------------------

          cat > pinn/os.json <<EOF
          {
            "name": "DragonOS Pi64",
            "description": "DragonOS Pi64 ${DRAGONOS_VERSION}",
            "version": "${DRAGONOS_VERSION}",
            "architecture": "arm64",
            "supported_models": [
              "Pi 3",
              "Pi 4",
              "Pi 400"
            ],
            "download_size": ${DOWNLOAD_SIZE},
            "nominal_size": ${NOMINAL_SIZE},
            "partitions": "partitions.json"
          }
          EOF

          echo
          echo "PINN metadata:"
          cat pinn/partitions.json
          echo
          cat pinn/os.json

          echo
          echo "Beende Mounts..."

          sudo umount work/boot
          sudo umount work/root

          sudo losetup -d "$BOOT_LOOPDEV"
          BOOT_LOOPDEV=""

          sudo losetup -d "$ROOT_LOOPDEV"
          ROOT_LOOPDEV=""

          sudo losetup -d "$LOOPDEV"
          LOOPDEV=""

          trap - EXIT

      # ------------------------------------------------------------
      # Create checksums
      # ------------------------------------------------------------

      - name: Create PINN checksums
        run: |
          set -euo pipefail

          sha256sum \
            boot.tar.xz \
            root.tar.xz \
            pinn/partitions.json \
            pinn/os.json \
            > SHA256SUMS

          cat SHA256SUMS

      # ------------------------------------------------------------
      # Upload PINN files to release
      # ------------------------------------------------------------

      - name: Upload PINN files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Lade PINN-Dateien hoch..."

          gh release upload "$RELEASE_TAG" \
            --repo "$REPO" \
            --clobber \
            boot.tar.xz \
            root.tar.xz \
            SHA256SUMS \
            pinn/partitions.json \
            pinn/os.json

          echo "PINN-Dateien erfolgreich hochgeladen."

      # ------------------------------------------------------------
      # Upload workflow artifacts for debugging
      # ------------------------------------------------------------

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dragonos-pi64-pinn-${{ env.DRAGONOS_VERSION }}
          path: |
            boot.tar.xz
            root.tar.xz
            SHA256SUMS
            pinn/partitions.json
            pinn/os.json
          if-no-files-found: error
          retention-days: 7

      # ------------------------------------------------------------
      # Final summary
      # ------------------------------------------------------------

      - name: Build summary
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " DragonOS Pi64 PINN Build erfolgreich"
          echo "=============================================="
          echo

          echo "Release:"
          echo "$RELEASE_TAG"
          echo

          echo "Dateien:"
          ls -lh \
            boot.tar.xz \
            root.tar.xz \
            SHA256SUMS

          echo
          echo "PINN:"
          ls -lh pinn/

          echo
          echo "SHA256:"
          cat SHA256SUMS

          echo
          echo "Runner Speicher:"
          df -h .
