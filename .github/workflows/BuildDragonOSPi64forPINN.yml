name: 🐉 Build DragonOS Pi64 for PINN

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  DRAGONOS_URL: "https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz/download"
  IMAGE_GZ: "DragonOS_Pi64_Beta42.img.gz"
  IMAGE: "DragonOS_Pi64_Beta42.img"

  SF_HOST: "frs.sourceforge.net"
  SF_PROJECT: "dragonos-pi64"
  SF_RELEASE: "PINN"

  OS_NAME: "DragonOS_Pi64"
  OS_VERSION: "Beta42"

jobs:
  build-pinn:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository klonen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Benötigte Tools installieren
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            xz-utils \
            parted \
            util-linux \
            e2fsprogs \
            dosfstools \
            rsync \
            jq \
            curl \
            openssh-client

      - name: 📥 DragonOS Pi64 Beta42 herunterladen
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "==> Download DragonOS Pi64 Beta42"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 3600 \
            --progress-bar \
            --output "$IMAGE_GZ.tmp" \
            "$DRAGONOS_URL"

          echo
          echo "==> GZIP prüfen"

          gzip -t "$IMAGE_GZ.tmp"

          mv "$IMAGE_GZ.tmp" "$IMAGE_GZ"

          echo
          echo "Download erfolgreich:"
          ls -lh "$IMAGE_GZ"

      - name: 📦 DragonOS Image entpacken
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "==> Entpacke $IMAGE_GZ"

          gzip -t "$IMAGE_GZ"

          gzip -dc "$IMAGE_GZ" > "$IMAGE.tmp"

          test -s "$IMAGE.tmp"

          mv "$IMAGE.tmp" "$IMAGE"

          echo
          echo "Image erfolgreich erzeugt:"
          ls -lh "$IMAGE"

          echo
          echo "Image-Typ:"
          file "$IMAGE"

      - name: 🔍 Partitionen erkennen und PINN-Tarballs erzeugen
        shell: bash
        run: |
          set -Eeuo pipefail

          WORK="$PWD/work"
          BOOT="$WORK/boot"
          ROOT="$WORK/root"

          mkdir -p "$BOOT" "$ROOT"

          MOUNTED_BOOT=0
          MOUNTED_ROOT=0

          cleanup_mounts() {
            local status=$?

            set +e

            if (( MOUNTED_ROOT )); then
              sudo umount "$ROOT" 2>/dev/null || \
                sudo umount -l "$ROOT" 2>/dev/null || true
              MOUNTED_ROOT=0
            fi

            if (( MOUNTED_BOOT )); then
              sudo umount "$BOOT" 2>/dev/null || \
                sudo umount -l "$BOOT" 2>/dev/null || true
              MOUNTED_BOOT=0
            fi

            exit "$status"
          }

          trap cleanup_mounts EXIT

          if [[ ! -f "$IMAGE" || ! -s "$IMAGE" ]]; then
            echo "❌ Image fehlt oder ist leer: $IMAGE"
            exit 1
          fi

          SECTOR_SIZE=$(sudo blockdev --getss "$IMAGE")
          if [[ ! "$SECTOR_SIZE" =~ ^[0-9]+$ || "$SECTOR_SIZE" -le 0 ]]; then
            echo "❌ Ungültige Sektorgröße: '$SECTOR_SIZE'"
            exit 1
          fi

          echo "Sektorgröße: ${SECTOR_SIZE} Bytes"

          echo
          echo "=============================="
          echo "Partitionstabelle"
          echo "=============================="

          sudo parted -s "$IMAGE" unit s print
          PARTED_OUTPUT=$(sudo parted -ms "$IMAGE" unit s print)

          PARTITION_LINES=$(
            printf '%s\n' "$PARTED_OUTPUT" |
              awk -F: '$1 ~ /^[0-9]+$/'
          )

          if [[ -z "$PARTITION_LINES" ]]; then
            echo "❌ Keine Partitionen gefunden."
            exit 1
          fi

          echo
          echo "Machine-readable Partitionen:"
          echo "$PARTITION_LINES"

          BOOT_PARTITION=""
          ROOT_PARTITION=""

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue

            NUMBER=$(printf '%s\n' "$line" | cut -d: -f1)
            FILESYSTEM=$(
              printf '%s\n' "$line" |
                cut -d: -f5 |
                tr '[:upper:]' '[:lower:]'
            )

            case "$FILESYSTEM" in
              fat|fat16|fat32|vfat)
                if [[ -z "$BOOT_PARTITION" ]]; then
                  BOOT_PARTITION="$NUMBER"
                fi
                ;;
              ext2|ext3|ext4)
                if [[ -z "$ROOT_PARTITION" ]]; then
                  ROOT_PARTITION="$NUMBER"
                fi
                ;;
            esac
          done <<< "$PARTITION_LINES"

          if [[ -z "$BOOT_PARTITION" ]]; then
            echo "❌ Keine FAT-Bootpartition gefunden."
            exit 1
          fi

          if [[ -z "$ROOT_PARTITION" ]]; then
            echo "❌ Keine ext2/ext3/ext4-Rootpartition gefunden."
            exit 1
          fi

          echo
          echo "✅ Boot-Partition : $BOOT_PARTITION"
          echo "✅ Root-Partition : $ROOT_PARTITION"

          get_partition_field() {
            local number="$1"
            local field="$2"

            printf '%s\n' "$PARTITION_LINES" |
              awk -F: \
                -v number="$number" \
                -v field="$field" '
                  $1 == number {
                    value = $field
                    sub(/s$/, "", value)
                    print value
                    exit
                  }
                '
          }

          get_partition_fs() {
            local number="$1"

            printf '%s\n' "$PARTITION_LINES" |
              awk -F: -v number="$number" '
                $1 == number {
                  print tolower($5)
                  exit
                }
              '
          }

          BOOT_FS=$(get_partition_fs "$BOOT_PARTITION")
          ROOT_FS=$(get_partition_fs "$ROOT_PARTITION")

          BOOT_START=$(get_partition_field "$BOOT_PARTITION" 2)
          BOOT_END=$(get_partition_field "$BOOT_PARTITION" 3)
          ROOT_START=$(get_partition_field "$ROOT_PARTITION" 2)
          ROOT_END=$(get_partition_field "$ROOT_PARTITION" 3)

          for VALUE_NAME in BOOT_START BOOT_END ROOT_START ROOT_END; do
            VALUE="${!VALUE_NAME}"
            if [[ ! "$VALUE" =~ ^[0-9]+$ ]]; then
              echo "❌ Ungültiger Wert für $VALUE_NAME: '$VALUE'"
              exit 1
            fi
          done

          BOOT_SECTORS=$((BOOT_END - BOOT_START + 1))
          ROOT_SECTORS=$((ROOT_END - ROOT_START + 1))
          BOOT_PARTITION_BYTES=$((BOOT_SECTORS * SECTOR_SIZE))
          ROOT_PARTITION_BYTES=$((ROOT_SECTORS * SECTOR_SIZE))
          BOOT_PARTITION_MIB=$((BOOT_PARTITION_BYTES / 1024 / 1024))
          ROOT_PARTITION_MIB=$((ROOT_PARTITION_BYTES / 1024 / 1024))

          if (( ROOT_PARTITION_BYTES < 1024 * 1024 * 1024 )); then
            echo "❌ Root-Partition ist kleiner als 1 GiB."
            exit 1
          fi

          echo
          echo "=============================="
          echo "Erkannte Partitionen"
          echo "=============================="

          echo "BOOT"
          echo "  Nummer : $BOOT_PARTITION"
          echo "  FS     : $BOOT_FS"
          echo "  Start  : $BOOT_START"
          echo "  Ende   : $BOOT_END"
          echo "  Größe  : ${BOOT_PARTITION_MIB} MiB"

          echo
          echo "ROOT"
          echo "  Nummer : $ROOT_PARTITION"
          echo "  FS     : $ROOT_FS"
          echo "  Start  : $ROOT_START"
          echo "  Ende   : $ROOT_END"
          echo "  Größe  : ${ROOT_PARTITION_MIB} MiB"

          BOOT_OFFSET=$((BOOT_START * SECTOR_SIZE))
          ROOT_OFFSET=$((ROOT_START * SECTOR_SIZE))

          echo
          echo "BOOT Offset: $BOOT_OFFSET"
          echo "ROOT Offset: $ROOT_OFFSET"

          echo
          echo "==> Mount Boot readonly"
          sudo mount -o loop,ro,offset="$BOOT_OFFSET" "$IMAGE" "$BOOT"
          MOUNTED_BOOT=1

          echo
          echo "==> Mount Root readonly"
          sudo mount -o loop,ro,offset="$ROOT_OFFSET" "$IMAGE" "$ROOT"
          MOUNTED_ROOT=1

          echo
          echo "=============================="
          echo "BOOT Inhalt"
          echo "=============================="
          sudo ls -la "$BOOT" | head -40

          echo
          echo "=============================="
          echo "ROOT Inhalt"
          echo "=============================="
          sudo ls -la "$ROOT" | head -40

          for DIR in etc usr var; do
            if [[ ! -d "$ROOT/$DIR" ]]; then
              echo "❌ Root-Partition ungültig:"
              echo "   $ROOT/$DIR fehlt."
              exit 1
            fi
          done

          echo
          echo "✅ Root-Partition erfolgreich verifiziert."

          echo
          echo "==> Erzeuge boot.tar.xz"
          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            -C "$BOOT" \
            -cJf boot.tar.xz .

          echo
          echo "==> Erzeuge root.tar.xz"
          sudo tar \
            --xattrs \
            --acls \
            --numeric-owner \
            --one-file-system \
            --exclude="./lost+found" \
            -C "$ROOT" \
            -cJf root.tar.xz .

          echo
          echo "==> Prüfe boot.tar.xz"
          xz -t boot.tar.xz
          tar -tJf boot.tar.xz >/dev/null
          echo "✅ boot.tar.xz OK"

          echo
          echo "==> Prüfe root.tar.xz"
          xz -t root.tar.xz
          tar -tJf root.tar.xz >/dev/null
          echo "✅ root.tar.xz OK"

          echo
          echo "==> Ermittle unkomprimierte Tarball-Größen"

          BOOT_RAW_BYTES=$(
            sudo tar \
              --xattrs \
              --acls \
              --numeric-owner \
              --one-file-system \
              -C "$BOOT" \
              -cf - . |
              wc -c
          )

          ROOT_RAW_BYTES=$(
            sudo tar \
              --xattrs \
              --acls \
              --numeric-owner \
              --one-file-system \
              --exclude="./lost+found" \
              -C "$ROOT" \
              -cf - . |
              wc -c
          )

          BOOT_UNCOMPRESSED_MIB=$(((BOOT_RAW_BYTES + 1024 * 1024 - 1) / 1024 / 1024))
          ROOT_UNCOMPRESSED_MIB=$(((ROOT_RAW_BYTES + 1024 * 1024 - 1) / 1024 / 1024))

          BOOT_NOMINAL=$((BOOT_UNCOMPRESSED_MIB + 100))
          ROOT_NOMINAL=$((ROOT_UNCOMPRESSED_MIB + 400))
          NOMINAL_SIZE=$((BOOT_NOMINAL + ROOT_NOMINAL))

          BOOT_SIZE=$(stat -c%s boot.tar.xz)
          ROOT_SIZE=$(stat -c%s root.tar.xz)
          DOWNLOAD_SIZE=$((BOOT_SIZE + ROOT_SIZE))

          BOOT_SHA512=$(sha512sum boot.tar.xz | awk '{print $1}')
          ROOT_SHA512=$(sha512sum root.tar.xz | awk '{print $1}')

          echo
          echo "=============================="
          echo "PINN Build Ergebnis"
          echo "=============================="

          echo "Boot Partition       : ${BOOT_PARTITION_MIB} MiB"
          echo "Root Partition       : ${ROOT_PARTITION_MIB} MiB"
          echo "Boot Tar uncompressed: ${BOOT_RAW_BYTES} Bytes"
          echo "Root Tar uncompressed: ${ROOT_RAW_BYTES} Bytes"
          echo "Boot nominal         : ${BOOT_NOMINAL} MiB"
          echo "Root nominal         : ${ROOT_NOMINAL} MiB"
          echo "Boot tarball         : ${BOOT_SIZE} Bytes"
          echo "Root tarball         : ${ROOT_SIZE} Bytes"

          echo
          echo "Boot SHA512:"
          echo "$BOOT_SHA512"

          echo
          echo "Root SHA512:"
          echo "$ROOT_SHA512"

          {
            echo "BOOT_PARTITION=$BOOT_PARTITION"
            echo "ROOT_PARTITION=$ROOT_PARTITION"
            echo "BOOT_FS=$BOOT_FS"
            echo "ROOT_FS=$ROOT_FS"
            echo "BOOT_START=$BOOT_START"
            echo "BOOT_END=$BOOT_END"
            echo "ROOT_START=$ROOT_START"
            echo "ROOT_END=$ROOT_END"
            echo "BOOT_OFFSET=$BOOT_OFFSET"
            echo "ROOT_OFFSET=$ROOT_OFFSET"
            echo "BOOT_PARTITION_MIB=$BOOT_PARTITION_MIB"
            echo "ROOT_PARTITION_MIB=$ROOT_PARTITION_MIB"
            echo "BOOT_RAW_BYTES=$BOOT_RAW_BYTES"
            echo "ROOT_RAW_BYTES=$ROOT_RAW_BYTES"
            echo "BOOT_UNCOMPRESSED_MIB=$BOOT_UNCOMPRESSED_MIB"
            echo "ROOT_UNCOMPRESSED_MIB=$ROOT_UNCOMPRESSED_MIB"
            echo "BOOT_NOMINAL=$BOOT_NOMINAL"
            echo "ROOT_NOMINAL=$ROOT_NOMINAL"
            echo "NOMINAL_SIZE=$NOMINAL_SIZE"
            echo "BOOT_SIZE=$BOOT_SIZE"
            echo "ROOT_SIZE=$ROOT_SIZE"
            echo "DOWNLOAD_SIZE=$DOWNLOAD_SIZE"
            echo "BOOT_SHA512=$BOOT_SHA512"
            echo "ROOT_SHA512=$ROOT_SHA512"
          } >> "$GITHUB_ENV"

          echo
          echo "✅ PINN-Tarballs erfolgreich erzeugt."

      - name: 📝 PINN Metadaten erzeugen
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d dragonos ]]; then
            mkdir -p dragonos
          fi

          if [[ ! -f dragonos/icon.png ]]; then
            echo "❌ dragonos/icon.png fehlt."
            exit 1
          fi

          if [[ ! -f dragonos/slides_vga.png ]]; then
            echo "❌ dragonos/slides_vga.png fehlt."
            exit 1
          fi

          if [[ ! -f dragonos/partition_setup.sh ]]; then
            echo "❌ dragonos/partition_setup.sh fehlt."
            exit 1
          fi

          cp dragonos/icon.png "dragonos/${OS_NAME}.png"
          tar -C dragonos -cJf dragonos/marketing.tar slides_vga.png

          chmod +x dragonos/partition_setup.sh

          PARTITION_SETUP_SHA512=$(
            sha512sum dragonos/partition_setup.sh |
            awk '{print $1}'
          )

          jq -n \
            --arg boot_label "dragon_boot" \
            --arg root_label "dragon_root" \
            --arg boot_sha "$BOOT_SHA512" \
            --arg root_sha "$ROOT_SHA512" \
            --argjson boot_nominal "$BOOT_NOMINAL" \
            --argjson root_nominal "$ROOT_NOMINAL" \
            --argjson boot_raw "$BOOT_UNCOMPRESSED_MIB" \
            --argjson root_raw "$ROOT_UNCOMPRESSED_MIB" \
            '{
              partitions: [
                {
                  label: $boot_label,
                  filesystem_type: "fat",
                  partition_size_nominal: $boot_nominal,
                  want_maximised: false,
                  uncompressed_tarball_size: $boot_raw,
                  sha512sum: $boot_sha,
                  requires_partition_number: 1,
                  mkfs_options: "-F 32"
                },
                {
                  label: $root_label,
                  filesystem_type: "ext4",
                  partition_size_nominal: $root_nominal,
                  want_maximised: true,
                  uncompressed_tarball_size: $root_raw,
                  sha512sum: $root_sha,
                  requires_partition_number: 2
                }
              ]
            }' > dragonos/partitions.json

          jq -n \
            --arg name "$OS_NAME" \
            --arg version "$OS_VERSION" \
            --arg release_date "$(date -u +%Y-%m-%d)" \
            --arg desc "DragonOS Pi64 – SDR, Funkanalyse und Pentest" \
            --arg url "https://sourceforge.net/projects/dragonos-pi64/" \
            --arg username "pi" \
            --arg password "dragonos" \
            --arg sha "$PARTITION_SETUP_SHA512" \
            --argjson nominal "$NOMINAL_SIZE" \
            --argjson download "$DOWNLOAD_SIZE" \
            '{
              name: $name,
              description: $desc,
              release_date: $release_date,
              supported_models: [
                "Pi 4",
                "Pi Compute Module 4"
              ],
              supports_backup: false,
              nominal_size: $nominal,
              version: $version,
              url: $url,
              username: $username,
              password: $password,
              group: "Utility",
              download_size: $download,
              sha512sum: $sha
            }' > dragonos/os.json

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/dragonos"
          SF_BASE="https://sourceforge.net/projects/${SF_PROJECT}/files/${SF_RELEASE}"

          jq -n \
            --arg name "$OS_NAME" \
            --arg version "$OS_VERSION" \
            --arg release_date "$(date -u +%Y-%m-%d)" \
            --arg desc "DragonOS Pi64 – SDR, Funkanalyse und Pentest" \
            --arg icon "${RAW_BASE}/${OS_NAME}.png" \
            --arg marketing "${RAW_BASE}/marketing.tar" \
            --arg os_info "${RAW_BASE}/os.json" \
            --arg partitions_info "${RAW_BASE}/partitions.json" \
            --arg partition_setup "${RAW_BASE}/partition_setup.sh" \
            --arg boot "${SF_BASE}/boot.tar.xz/download" \
            --arg root "${SF_BASE}/root.tar.xz/download" \
            --argjson nominal "$NOMINAL_SIZE" \
            --argjson download "$DOWNLOAD_SIZE" \
            '{
              os_list: [
                {
                  description: $desc,
                  download_size: $download,
                  group: "Utility",
                  icon: $icon,
                  marketing_info: $marketing,
                  nominal_size: $nominal,
                  os_info: $os_info,
                  os_name: $name,
                  partition_setup: $partition_setup,
                  partitions_info: $partitions_info,
                  release_date: $release_date,
                  supported_models: [
                    "Pi 4",
                    "Pi Compute Module 4"
                  ],
                  supports_backup: false,
                  tarballs: [
                    $boot,
                    $root
                  ],
                  url: "https://sourceforge.net/projects/dragonos-pi64/",
                  username: "pi",
                  password: "dragonos",
                  version: $version
                }
              ]
            }' > os_list_v3.json

          echo
          echo "==> JSON prüfen"

          jq empty dragonos/os.json
          jq empty dragonos/partitions.json
          jq empty os_list_v3.json

          echo "✅ Alle JSON-Dateien sind gültig."

          echo
          echo "===== os.json ====="
          jq . dragonos/os.json

          echo
          echo "===== partitions.json ====="
          jq . dragonos/partitions.json

          echo
          echo "===== os_list_v3.json ====="
          jq . os_list_v3.json

      - name: 🔐 SourceForge SSH vorbereiten
        if: ${{ secrets.SF_USERNAME != '' && secrets.SF_SSH_KEY != '' }}
        shell: bash
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sourceforge_key
          chmod 600 ~/.ssh/sourceforge_key

          ssh-keyscan -H "$SF_HOST" >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host $SF_HOST
            HostName $SF_HOST
            User $SF_USERNAME
            IdentityFile ~/.ssh/sourceforge_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

          echo "✅ SourceForge SSH vorbereitet."

      - name: 🚀 PINN Tarballs zu SourceForge hochladen
        if: ${{ secrets.SF_USERNAME != '' && secrets.SF_SSH_KEY != '' }}
        shell: bash
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          set -Eeuo pipefail

          DEST="${SF_USERNAME}@${SF_HOST}:/home/frs/project/${SF_PROJECT}/${SF_RELEASE}/"

          echo "==> Upload nach:"
          echo "$DEST"

          rsync \
            -avP \
            --partial \
            -e "ssh -F ~/.ssh/config" \
            boot.tar.xz \
            root.tar.xz \
            "$DEST"

          echo
          echo "✅ Tarballs erfolgreich zu SourceForge übertragen."

      - name: ⚠️ SourceForge Secrets fehlen
        if: ${{ secrets.SF_USERNAME == '' || secrets.SF_SSH_KEY == '' }}
        shell: bash
        run: |
          echo "⚠️ SF_USERNAME oder SF_SSH_KEY fehlt."
          echo
          echo "Tarballs werden lokal erzeugt und nicht nach SourceForge hochgeladen."
          echo "Falls du Uploads brauchst, bitte diese Secrets setzen:"
          echo "  - SF_USERNAME"
          echo "  - SF_SSH_KEY"
          echo
          echo "Settings → Secrets and variables → Actions"

      - name: 💾 PINN Metadaten nach GitHub committen
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            dragonos/os.json \
            dragonos/partitions.json \
            dragonos/marketing.tar \
            "dragonos/${OS_NAME}.png" \
            os_list_v3.json

          if git diff --cached --quiet; then
            echo "ℹ️ Keine Änderungen an den Metadaten."
            exit 0
          fi

          git commit -m "🐉 Update DragonOS Pi64 PINN metadata ${OS_VERSION}"
          git push

          echo "✅ PINN-Metadaten wurden committed."

      - name: 📊 Build-Zusammenfassung
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " DragonOS Pi64 → PINN"
          echo "=========================================="
          echo
          echo "Version:"
          echo "$OS_VERSION"
          echo
          echo "Boot Tarball:"
          [[ -f boot.tar.xz ]] && ls -lh boot.tar.xz || true
          echo
          echo "Root Tarball:"
          [[ -f root.tar.xz ]] && ls -lh root.tar.xz || true
          echo
          echo "Metadaten:"
          [[ -f dragonos/os.json ]] && echo "  ✓ os.json"
          [[ -f dragonos/partitions.json ]] && echo "  ✓ partitions.json"
          [[ -f os_list_v3.json ]] && echo "  ✓ os_list_v3.json"
          [[ -f dragonos/marketing.tar ]] && echo "  ✓ marketing.tar"
          [[ -f "dragonos/${OS_NAME}.png" ]] && echo "  ✓ ${OS_NAME}.png"
          echo
          echo "=========================================="