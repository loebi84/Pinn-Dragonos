name:🐉BuildDragonOSPi64forPINN
on:
workflow_dispatch:
schedule:
-cron:"03**1"
permissions:
contents:write
env:
DRAGONOS_URL:"https://sourceforge.net/projects/dragonos-pi64/files/DragonOS_Pi64_Beta42.img.gz/download"
IMAGE_GZ:"DragonOS_Pi64_Beta42.img.gz"
IMAGE:"DragonOS_Pi64_Beta42.img"
jobs:
build-pinn:
runs-on:ubuntu-latest
steps:
#------------------------------------------------------------
#1.Repository
#------------------------------------------------------------
-name:📥Repositoryklonen
uses:actions/checkout@v4
#------------------------------------------------------------
#2.BenötigtePakete
#------------------------------------------------------------
-name:🔧Toolsinstallieren
run:|
sudoapt-getupdate
sudoapt-getinstall-y\
wget\
xz-utils\
parted\
util-linux\
e2fsprogs\
dosfstools\
rsync
#------------------------------------------------------------
#3.DragonOSBeta42herunterladen
#------------------------------------------------------------
-name:📥DragonOSBeta42herunterladen
run:|
echo"🐉LadeDragonOSPi64Beta42..."
wget\
--progress=dot:giga\
-O"$IMAGE_GZ"\
"$DRAGONOS_URL"
echo
echo"Download:"
ls-lh"$IMAGE_GZ"
#------------------------------------------------------------
#4.Imageentpacken
#------------------------------------------------------------
-name:📦Imageentpacken
run:|
echo"📦EntpackeImage..."
gzip-dc"$IMAGE_GZ">"$IMAGE"
echo
echo"Image:"
ls-lh"$IMAGE"
#------------------------------------------------------------
#5.Partitionenautomatischerkennen
#------------------------------------------------------------
-name:🔍Partitionstabelleanalysieren
run:|
echo"=====fdisk====="
sudofdisk-l"$IMAGE"
echo
echo"=====parted====="
sudoparted"$IMAGE"unitsprint
#------------------------------------------------------------
#6.PartitionenauslesenundTarballserzeugen
#------------------------------------------------------------
-name:🔧PINNTarballserzeugen
shell:bash
run:|
set-euopipefail
WORK="$PWD/work"
BOOT="$WORK/boot"
ROOT="$WORK/root"
mkdir-p"$BOOT""$ROOT"
#Beta42:
#Partition1=FAT32boot
#Partition2=ext4root
BOOT_START=$(sudofdisk-l"$IMAGE"|awk'$1~/img1$/{print$2}')
BOOT_END=$(sudofdisk-l"$IMAGE"|awk'$1~/img1$/{print$3}')
ROOT_START=$(sudofdisk-l"$IMAGE"|awk'$1~/img2$/{print$2}')
ROOT_END=$(sudofdisk-l"$IMAGE"|awk'$1~/img2$/{print$3}')
if[-z"$BOOT_START"]||[-z"$ROOT_START"];then
echo"❌Boot-oderRoot-Partitionnichtgefunden."
exit1
fi
SECTOR_SIZE=512
BOOT_OFFSET=$((BOOT_START*SECTOR_SIZE))
ROOT_OFFSET=$((ROOT_START*SECTOR_SIZE))
echo"Boot:"
echo"Startsector:$BOOT_START"
echo"Endsector:$BOOT_END"
echo"Offset:$BOOT_OFFSET"
echo
echo"Root:"
echo"Startsector:$ROOT_START"
echo"Endsector:$ROOT_END"
echo"Offset:$ROOT_OFFSET"
#--------------------------------------------------------
#Bootmounten
#--------------------------------------------------------
echo
echo"==>Mountboot"
sudomount\
-oloop,ro,offset="$BOOT_OFFSET"\
"$IMAGE""$BOOT"
#--------------------------------------------------------
#Rootmounten
#--------------------------------------------------------
echo"==>Mountroot"
sudomount\
-oloop,ro,offset="$ROOT_OFFSET"\
"$IMAGE""$ROOT"
#--------------------------------------------------------
#BootTarball
#--------------------------------------------------------
echo
echo"==>Erzeugeboot.tar.xz"
sudotar\
--xattrs\
--acls\
--numeric-owner\
--one-file-system\
-C"$BOOT"\
-cJfboot.tar.xz.
#--------------------------------------------------------
#RootTarball
#--------------------------------------------------------
echo"==>Erzeugeroot.tar.xz"
sudotar\
--xattrs\
--acls\
--numeric-owner\
--one-file-system\
--exclude='./lost+found'\
-C"$ROOT"\
-cJfroot.tar.xz.
#--------------------------------------------------------
#Größenermitteln
#--------------------------------------------------------
BOOT_UNCOMPRESSED=$(sudodu-sm"$BOOT"|awk'{print$1}')
ROOT_UNCOMPRESSED=$(sudodu-sm"$ROOT"|awk'{print$1}')
BOOT_PARTITION_SIZE=$(((BOOT_END-BOOT_START+1)*SECTOR_SIZE/1024/1024))
ROOT_PARTITION_SIZE=$(((ROOT_END-ROOT_START+1)*SECTOR_SIZE/1024/1024))
echo
echo"=====Größen====="
echo"BootPartition:${BOOT_PARTITION_SIZE}MiB"
echo"BootDaten:${BOOT_UNCOMPRESSED}MiB"
echo"RootPartition:${ROOT_PARTITION_SIZE}MiB"
echo"RootDaten:${ROOT_UNCOMPRESSED}MiB"
#--------------------------------------------------------
#SicherheitsmargefürPINN
#--------------------------------------------------------
BOOT_NOMINAL=$((BOOT_UNCOMPRESSED+100))
ROOT_NOMINAL=$((ROOT_UNCOMPRESSED+400))
#RootsolldenrestlichenPlatzbekommen
BOOT_MAX=false
ROOT_MAX=true
#--------------------------------------------------------
#TarballChecksums
#--------------------------------------------------------
BOOT_SHA512=$(sha512sumboot.tar.xz|awk'{print$1}')
ROOT_SHA512=$(sha512sumroot.tar.xz|awk'{print$1}')
BOOT_SIZE=$(stat-c%sboot.tar.xz)
ROOT_SIZE=$(stat-c%sroot.tar.xz)
DOWNLOAD_SIZE=$((BOOT_SIZE+ROOT_SIZE))
NOMINAL_SIZE=$((BOOT_NOMINAL+ROOT_NOMINAL))
echo
echo"boot.tar.xz:$BOOT_SIZEbytes"
echo"root.tar.xz:$ROOT_SIZEbytes"
echo"Download:$DOWNLOAD_SIZEbytes"
#--------------------------------------------------------
#Unmount
#--------------------------------------------------------
sudoumount"$BOOT"
sudoumount"$ROOT"
#--------------------------------------------------------
#WertefürnächstenStepspeichern
#--------------------------------------------------------
{
echo"BOOT_NOMINAL=$BOOT_NOMINAL"
echo"ROOT_NOMINAL=$ROOT_NOMINAL"
echo"BOOT_UNCOMPRESSED=$BOOT_UNCOMPRESSED"
echo"ROOT_UNCOMPRESSED=$ROOT_UNCOMPRESSED"
echo"BOOT_SHA512=$BOOT_SHA512"
echo"ROOT_SHA512=$ROOT_SHA512"
echo"BOOT_SIZE=$BOOT_SIZE"
echo"ROOT_SIZE=$ROOT_SIZE"
echo"DOWNLOAD_SIZE=$DOWNLOAD_SIZE"
echo"NOMINAL_SIZE=$NOMINAL_SIZE"
}>>"$GITHUB_ENV"
echo
echo"✅Tarballserfolgreicherzeugt."
#------------------------------------------------------------
#7.Tarballstesten
#------------------------------------------------------------
-name:🧪Tarballsprüfen
run:|
set-e
echo"Testeboot.tar.xz..."
xz-tboot.tar.xz
echo"Testeroot.tar.xz..."
xz-troot.tar.xz
echo"Testeboot.tar.xzInhalt..."
tar-tJfboot.tar.xz>/dev/null
echo"Testeroot.tar.xzInhalt..."
tar-tJfroot.tar.xz>/dev/null
echo"✅BeideTarballssindgültig."
#------------------------------------------------------------
#8.PINNpartitions.jsonerzeugen
#------------------------------------------------------------
-name:📝partitions.jsonerzeugen
run:|
mkdir-p\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos
cat>PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json<<EOF
{
"partitions":[
{
"label":"dragon_boot",
"filesystem_type":"fat",
"partition_size_nominal":${BOOT_NOMINAL},
"want_maximised":false,
"uncompressed_tarball_size":${BOOT_UNCOMPRESSED},
"partition_type":"0xC",
"active":true,
"mkfs_options":"-F32",
"sha512sum":"${BOOT_SHA512}"
},
{
"label":"dragon_root",
"filesystem_type":"ext4",
"partition_size_nominal":${ROOT_NOMINAL},
"want_maximised":true,
"uncompressed_tarball_size":${ROOT_UNCOMPRESSED},
"sha512sum":"${ROOT_SHA512}"
}
]
}
EOF
catPINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json
#------------------------------------------------------------
#9.os.jsonerzeugen
#------------------------------------------------------------
-name:📝os.jsonerzeugen
run:|
cat>PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/os.json<<'EOF'
{
"name":"dragonos-pi64",
"description":"DragonOSPi64–SDRDistribution",
"url":"https://sourceforge.net/projects/dragonos-pi64/",
"version":"Beta42",
"release_date":"2025-10-06",
"supported_models":[
"Pi4",
"Pi400",
"ComputeModule4"
],
"username":"dragon",
"password":"dragon",
"supports_backup":true,
"bootable":true,
"partition_setup":"partition_setup.sh",
"postinstall_script":"postinstall.sh"
}
EOF
#------------------------------------------------------------
#10.os_list_v3.jsonerzeugen
#------------------------------------------------------------
-name:📝os_list_v3.jsonerzeugen
run:|
cat>PINN_DragonOS_Repo_unzipped/os_list_v3.json<<EOF
{
"os_list":[
{
"description":"DragonOSPi64–SDRDistribution",
"download_size":${DOWNLOAD_SIZE},
"group":"Raspbian",
"icon":"https://loebi84.github.io/Pinn-Dragonos/dragonos/icon.png",
"nominal_size":${NOMINAL_SIZE},
"os_info":"https://loebi84.github.io/Pinn-Dragonos/dragonos/os.json",
"os_name":"dragonos-pi64",
"partition_setup":"https://loebi84.github.io/Pinn-Dragonos/dragonos/partition_setup.sh",
"partitions_info":"https://loebi84.github.io/Pinn-Dragonos/dragonos/partitions.json",
"release_date":"2025-10-06",
"supported_models":[
"Pi4",
"Pi400",
"ComputeModule4"
],
"supports_backup":true,
"tarballs":[
"https://loebi84.github.io/Pinn-Dragonos/dragonos/boot.tar.xz",
"https://loebi84.github.io/Pinn-Dragonos/dragonos/root.tar.xz"
],
"version":"Beta42"
}
]
}
EOF
#------------------------------------------------------------
#11.Ergebnisanzeigen
#------------------------------------------------------------
-name:📋Ergebnisanzeigen
run:|
echo"=====os_list_v3.json====="
catPINN_DragonOS_Repo_unzipped/os_list_v3.json
echo
echo"=====partitions.json====="
catPINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json
echo
echo"=====Tarballs====="
ls-lhboot.tar.xzroot.tar.xz
#------------------------------------------------------------
#12.TarballsalsWorkflow-Artefaktspeichern
#------------------------------------------------------------
-name:📦TarballsalsArtifact
uses:actions/upload-artifact@v4
with:
name:DragonOS-Pi64-Beta42-PINN-Tarballs
path:|
boot.tar.xz
root.tar.xz
retention-days:7
#------------------------------------------------------------
#13.PINN-MetadateninsReposchreiben
#------------------------------------------------------------
-name:⬆️PINNMetadatencommitten
run:|
gitconfiguser.name"LöbiBot"
gitconfiguser.email"bot@dragonos.local"
gitadd\
PINN_DragonOS_Repo_unzipped/os_list_v3.json\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/os.json\
PINN_DragonOS_Repo_unzipped/dragonos-pinn-repo/dragonos/partitions.json
ifgitdiff--cached--quiet;then
echo"KeineMetadatenänderung."
else
gitcommit-m"🐉UpdatePINNmetadataforDragonOSBeta42"
gitpush
fi

###⚠️EineSachemusstduvordemerstenLaufändern

ImletztenTeilstehenmomentan:

https://loebi84.github.io/Pinn-Dragonos/dragonos/boot.tar.xz
https://loebi84.github.io/Pinn-Dragonos/dragonos/root.tar.xz

DieseURLsfunktionierennochnicht,weilwirdiemehrereGBgroßenDateiennichtpergitpushinGitHubPagesbekommen.

Dasistaberabsichtlichso:DieActionerzeugtdieechtenDateienundlegtsiezunächstalsArtifactab.DanachkönnenwirsieaufSourceForgehochladenundnurdiesebeidenURLsinos_list_v3.json/partitions.jsoneinsetzen.

AußerdemhabeichdiePINN-StrukturgegenüberdeinerbisherigenDateikorrigiert:os_list_v3.jsonenthälteinos_list-Array,unddieeigentlichenPartitionsparametergehöreninpartitions.json.

**NocheinwichtigerPunkt:**Deinebisherigepostinstall.sh,partition_setup.shundicon.pngbleibendabeiunangetastet.

WenndudieseActionlaufenlässt,istdernächsteinteressanteOutputdieGrößevonboot.tar.xzundroot.tar.xz.DamitkönnenwiranschließenddenSourceForge-Uploadautomatisieren.